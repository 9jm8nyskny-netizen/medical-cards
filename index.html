<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسار — إدارة طلبات الفحص الطبي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#16231F; --ink-soft:#4C5E58; --line:#DEE7E2;
    --bg:#F4F8F6; --surface:#FFFFFF; --surface-2:#EEF4F1;
    --brand:#0E6B5C; --brand-dark:#0A4E43; --brand-tint:#E3F2EE;
    --amber:#B9852B; --amber-tint:#FBF1DF;
    --blue:#3468A0; --blue-tint:#E7EFF7;
    --violet:#6B5AA6; --violet-tint:#EEEBF8;
    --green:#2D8A54; --green-tint:#E5F4EA;
    --red:#B8473B; --red-tint:#FBEAE8;
    --teal-solid:#0E6B5C;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#EAF1EE; --ink-soft:#A9BBB4; --line:#26332F;
      --bg:#101915; --surface:#16211C; --surface-2:#1C2823;
      --brand:#3FAE93; --brand-dark:#2C8A73; --brand-tint:#17332B;
      --amber:#D8A94E; --amber-tint:#2E2712;
      --blue:#79A6D6; --blue-tint:#16273A;
      --violet:#A996E0; --violet-tint:#251E3A;
      --green:#6FC495; --green-tint:#132A1D;
      --red:#E0847A; --red-tint:#331917;
      --teal-solid:#3FAE93;
    }
  }
  html,body{height:100%;}
  *,*::before,*::after{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    background:var(--bg); color:var(--ink); font-family:'Tajawal',sans-serif; -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    overflow-x:hidden;
  }
  h1,h2,h3,.brandfont{font-family:'Cairo',sans-serif;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:14px;}
  .btn{border-radius:10px; font-weight:700; transition:transform .08s ease, opacity .15s ease; white-space:nowrap;}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.55; cursor:not-allowed;}
  .btn-brand{background:var(--brand); color:#fff;}
  .btn-brand:hover{background:var(--brand-dark);}
  .btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-danger{background:var(--red); color:#fff;}
  .req-type-btn{background:var(--surface-2); color:var(--ink-soft); border:1.5px solid var(--line); padding:.6rem .8rem;}
  .req-type-btn.active{background:var(--brand); color:#fff; border-color:var(--brand);}
  .btn-danger:hover{opacity:.9;}
  input,select,textarea{
    background:var(--surface); color:var(--ink); border:1px solid var(--line);
    border-radius:10px; padding:.6rem .8rem; width:100%; font-family:inherit; font-size:1rem;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brand); outline-offset:1px; border-color:var(--brand);}
  label.field-label{font-size:.8rem; color:var(--ink-soft); font-weight:700; margin-bottom:.3rem; display:block;}
  .badge{display:inline-flex; align-items:center; gap:.35rem; padding:.28rem .7rem; border-radius:999px; font-size:.78rem; font-weight:700; white-space:nowrap;}
  .navlink{display:flex; align-items:center; gap:.65rem; padding:.7rem .9rem; border-radius:10px; color:var(--ink-soft); font-weight:700; font-size:.9rem; cursor:pointer; min-height:44px;}
  .navlink:hover{background:var(--surface-2); color:var(--ink);}
  .navlink.active{background:var(--brand); color:#fff; box-shadow:0 6px 16px -6px color-mix(in srgb, var(--brand) 70%, transparent);}
  .scrollx{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  table{border-collapse:collapse; width:100%;}
  th{font-size:.76rem; color:var(--ink-soft); font-weight:700; text-align:right; padding:.6rem .8rem; border-bottom:1px solid var(--line); white-space:nowrap;}
  td{padding:.65rem .8rem; border-bottom:1px solid var(--line); font-size:.87rem; vertical-align:middle;}
  tr:hover td{background:var(--surface-2);}
  table.rtable tr.rt-row{cursor:pointer;}
  .rt-emp{display:flex; align-items:center; gap:.55rem; white-space:nowrap;}
  /* Compact real table on phones: keep it a genuine table (like a normal list),
     just hide the secondary columns instead of stacking every field into a tall card. */
  @media (max-width: 640px){
    table.rtable th, table.rtable td{ padding:.55rem .5rem; font-size:.82rem; }
    table.rtable .hide-sm{ display:none; }
    table.rtable .rt-emp{ gap:.4rem; }
  }
  .modal-backdrop{position:fixed; inset:0; background:rgba(10,20,17,.5); backdrop-filter:blur(2px); z-index:50; display:flex; align-items:center; justify-content:center; padding:1rem;}
  .avatar{width:44px; height:44px; border-radius:50%; object-fit:cover; background:var(--surface-2); border:1px solid var(--line);}
  .spin{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .fade-in{animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
  ::-webkit-scrollbar{height:8px; width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px;}
  .stat-num{font-family:'Cairo',sans-serif; font-weight:800; font-size:1.7rem;}
  .stat-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:.75rem; }
  @media (min-width:640px){ .stat-grid{ grid-template-columns:repeat(3,1fr); gap:.9rem; } }
  @media (min-width:1024px){ .stat-grid{ grid-template-columns:repeat(6,1fr); } }
  .filters-grid{ display:grid; grid-template-columns:1fr 1fr; gap:.75rem; }
  @media (min-width:640px){ .filters-grid{ grid-template-columns:repeat(3,1fr); } }
  @media (min-width:1024px){ .filters-grid{ grid-template-columns:repeat(6,1fr); } }
  .cards-grid{ display:grid; grid-template-columns:1fr; gap:1rem; }
  @media (min-width:640px){ .cards-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (min-width:1280px){ .cards-grid{ grid-template-columns:repeat(3,1fr); } }
  .err-box{background:var(--red-tint); color:var(--red); border-radius:10px; padding:.6rem .8rem; font-size:.8rem; display:flex; align-items:center; gap:.5rem;}

  /* ===================== App shell — dedicated professional dark theme =====================
     Applied post-login regardless of OS light/dark setting, so the dashboard always looks like
     the branded product rather than following the visitor's system preference. Because every
     existing rule already reads colors from CSS custom properties (var(--bg), var(--surface)…),
     redefining those properties on .app-shell cascades to every component underneath for free. */
  #app .app-shell{
    --ink:#F3F8F6; --ink-soft:#96AAA2; --line:#223530;
    --bg:#0A1310; --surface:#152119; --surface-2:#1C2B23;
    --brand:#18B989; --brand-dark:#0F9B72; --brand-tint:#163C2E;
    --amber:#E3A93F; --amber-tint:#2E2712;
    --blue:#4E93E8; --blue-tint:#16273A;
    --violet:#9E86F2; --violet-tint:#251E3A;
    --green:#3FCB84; --green-tint:#132A1D;
    --red:#F0685C; --red-tint:#331917;
    background:var(--bg); color:var(--ink); min-height:100vh; width:100%;
  }
  .app-logo-text{
    font-family:'Cairo',sans-serif; font-weight:800; font-size:1.35rem;
    background:linear-gradient(90deg,#3FE0AE,#E8C468); -webkit-background-clip:text; background-clip:text;
    color:transparent; line-height:1.1;
  }
  .app-sidebar{
    margin:14px; border-radius:20px; background:var(--surface); border:1px solid var(--line);
    box-shadow:0 18px 40px -22px rgba(0,0,0,.55);
  }
  .stat-tile{
    border-radius:16px; padding:1rem 1.1rem; color:#fff; position:relative; overflow:hidden;
    box-shadow:0 14px 28px -16px rgba(0,0,0,.45);
    display:flex; flex-direction:column; justify-content:flex-start;
    height:118px;
  }
  .stat-tile .stat-icon{
    width:32px; height:32px; border-radius:9px; background:rgba(255,255,255,.18);
    display:flex; align-items:center; justify-content:center; margin-bottom:.5rem; flex-shrink:0;
  }
  .stat-tile .stat-label{
    font-size:.76rem; font-weight:700; opacity:.92; line-height:1.25; margin-bottom:.2rem;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .stat-tile .stat-num{font-family:'Cairo',sans-serif; font-weight:800; font-size:1.7rem; line-height:1; margin-top:auto;}
  @media (max-width:400px){ .stat-tile{ height:108px; padding:.85rem .9rem; } }
  .stat-tile-clickable{ cursor:pointer; transition:transform .1s ease, box-shadow .15s ease; }
  .stat-tile-clickable:hover{ box-shadow:0 18px 34px -14px rgba(0,0,0,.55); }
  .stat-tile-clickable:active{ transform:scale(.97); }
  .online-dot{
    position:absolute; inset-inline-end:-1px; bottom:-1px; width:11px; height:11px; border-radius:50%;
    background:var(--green); border:2px solid var(--surface);
  }
  .pill-btn{
    display:flex; align-items:center; justify-content:center; gap:.4rem; width:100%;
    background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line);
    border-radius:999px; padding:.55rem .8rem; font-size:.78rem; font-weight:700; cursor:pointer;
  }
  .pill-btn:hover{background:var(--line); color:var(--ink);}

  /* ===================== Auth screen ===================== */
  .auth-page{
    min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center; padding:1.25rem;
    background:
      radial-gradient(60% 50% at 15% 10%, color-mix(in srgb, var(--brand) 16%, transparent), transparent 60%),
      radial-gradient(55% 45% at 90% 85%, color-mix(in srgb, var(--brand) 12%, transparent), transparent 60%),
      var(--bg);
  }
  .auth-card{
    position:relative; overflow:hidden; background:var(--surface); border:1px solid var(--line);
    border-radius:20px; box-shadow:0 24px 60px -20px rgba(10,30,25,.28);
  }
  .auth-card::before{
    content:''; position:absolute; inset-inline:0; top:0; height:4px;
    background:linear-gradient(90deg, var(--brand), var(--teal-solid), var(--brand));
  }
  .auth-logo{
    width:52px; height:52px; border-radius:14px; flex-shrink:0;
    background:linear-gradient(145deg, var(--brand), var(--brand-dark));
    display:flex; align-items:center; justify-content:center; color:#fff;
    font-family:'Cairo',sans-serif; font-weight:800; font-size:1.15rem;
    box-shadow:0 8px 18px -6px color-mix(in srgb, var(--brand) 70%, transparent);
  }
  .auth-title{font-family:'Cairo',sans-serif; font-weight:800; font-size:1.35rem; letter-spacing:.01em; color:var(--ink);}
  .auth-subtitle{font-family:'Tajawal',sans-serif; font-weight:500; font-size:.86rem; color:var(--ink-soft); line-height:1.5;}
  .field-icon-wrap{position:relative; direction:ltr;}
  .field-icon-wrap input{
    padding-inline-start:2.6rem; padding-inline-end:.8rem;
    font-family:'Tajawal',sans-serif; text-align:left;
  }
  .field-icon-wrap input[type="password"]{padding-inline-end:2.6rem;}
  /* Neutralize browser autofill styling (Chrome/Edge force their own bg + font,
     which is what breaks the consistent look once autocomplete is enabled). */
  .field-icon-wrap input:-webkit-autofill,
  .field-icon-wrap input:-webkit-autofill:hover,
  .field-icon-wrap input:-webkit-autofill:focus{
    -webkit-text-fill-color:var(--ink) !important;
    caret-color:var(--ink);
    -webkit-box-shadow:0 0 0 1000px var(--surface) inset !important;
    box-shadow:0 0 0 1000px var(--surface) inset !important;
    font-family:'Tajawal',sans-serif !important;
    transition:background-color 9999s ease-in-out 0s;
  }
  .field-icon{
    position:absolute; inset-inline-start:.75rem; top:50%; transform:translateY(-50%);
    color:var(--ink-soft); pointer-events:none; display:flex;
  }
  .field-toggle{
    position:absolute; inset-inline-end:.5rem; top:50%; transform:translateY(-50%);
    color:var(--ink-soft); background:transparent; border:none; padding:.35rem; border-radius:8px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:0;
  }
  .field-toggle:hover{background:var(--surface-2); color:var(--ink);}
  .auth-divider{display:flex; align-items:center; gap:.75rem; margin-block:1.1rem; color:var(--ink-soft); font-size:.72rem;}
  .auth-divider::before,.auth-divider::after{content:''; flex:1; height:1px; background:var(--line);}
  .auth-footnote{
    display:flex; align-items:flex-start; gap:.55rem; background:var(--surface-2); border:1px solid var(--line);
    border-radius:12px; padding:.7rem .85rem; font-size:.77rem; color:var(--ink-soft); line-height:1.55;
  }
  .auth-footnote svg{flex-shrink:0; margin-top:.1rem;}
  .whatsapp-btn{
    display:flex; align-items:center; justify-content:center; gap:.5rem; margin-top:.75rem;
    background:#25D366; color:#fff; border-radius:10px; padding:.65rem .9rem; font-size:.85rem;
    font-weight:700; text-decoration:none; transition:opacity .15s ease, transform .08s ease;
  }
  .whatsapp-btn:hover{opacity:.9;}
  .whatsapp-btn:active{transform:scale(.97);}
  .secure-badge{
    display:inline-flex; align-items:center; gap:.35rem; font-size:.72rem; font-weight:700;
    color:var(--brand-dark); background:var(--brand-tint); padding:.3rem .65rem; border-radius:999px;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .secure-badge{ color:var(--brand); } }

  /* ===================== Self-contained layout utilities =====================
     Replaces the Tailwind Play CDN (which requires an external script to run at
     load time and can silently fail to apply on some networks/devices — that
     was the cause of the broken mobile layout). Every class below is written
     out as plain CSS so the layout always works, with zero runtime dependency. */
  .flex{display:flex;} .inline-flex{display:inline-flex;}
  .grid{display:grid;} .grid-cols-2{grid-template-columns:repeat(2,1fr);}
  .flex-1{flex:1 1 0%;} .flex-col{flex-direction:column;} .flex-wrap{flex-wrap:wrap;} .shrink-0{flex-shrink:0;}
  .items-center{align-items:center;} .items-start{align-items:flex-start;} .items-end{align-items:flex-end;}
  .justify-between{justify-content:space-between;} .justify-center{justify-content:center;}
  .col-span-2{grid-column:span 2 / span 2;}
  .font-bold{font-weight:700;} .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .text-center{text-align:center;} .leading-none{line-height:1;} .leading-relaxed{line-height:1.6;}
  .hidden{display:none;} .relative{position:relative;} .absolute{position:absolute;}
  .inset-0{top:0;left:0;right:0;bottom:0;} .top-0{top:0;} .bottom-0{bottom:0;} .right-0{right:0;}
  .overflow-hidden{overflow:hidden;} .cursor-pointer{cursor:pointer;}
  .min-h-screen{min-height:100vh;} .min-w-0{min-width:0;} .w-full{width:100%;} .mx-auto{margin-inline:auto;}
  .mr-1{margin-right:.25rem;}
  .max-w-sm{max-width:24rem;} .max-w-md{max-width:28rem;} .max-w-lg{max-width:32rem;} .max-w-2xl{max-width:42rem;}
  .text-xs{font-size:.75rem;} .text-sm{font-size:.875rem;} .text-base{font-size:1rem;} .text-lg{font-size:1.125rem;} .text-xl{font-size:1.25rem;}
  .text-\[10px\]{font-size:10px;} .text-\[11px\]{font-size:11px;}
  .rounded-lg{border-radius:.5rem;} .rounded-xl{border-radius:.75rem;}
  .gap-1{gap:.25rem;} .gap-1\.5{gap:.375rem;} .gap-2{gap:.5rem;} .gap-3{gap:.75rem;} .gap-4{gap:1rem;} .gap-6{gap:1.5rem;}
  .gap-y-1\.5{row-gap:.375rem;} .gap-y-2{row-gap:.5rem;}
  .justify-end{justify-content:flex-end;}
  .mb-1{margin-bottom:.25rem;} .mb-2{margin-bottom:.5rem;} .mb-3{margin-bottom:.75rem;} .mb-4{margin-bottom:1rem;} .mb-5{margin-bottom:1.25rem;} .mb-6{margin-bottom:1.5rem;}
  .mt-0\.5{margin-top:.125rem;} .mt-1{margin-top:.25rem;} .mt-2{margin-top:.5rem;} .mt-3{margin-top:.75rem;} .mt-4{margin-top:1rem;} .mt-5{margin-top:1.25rem;} .mt-auto{margin-top:auto;}
  .p-2{padding:.5rem;} .p-3{padding:.75rem;} .p-4{padding:1rem;} .p-5{padding:1.25rem;} .p-6{padding:1.5rem;}
  .pb-4{padding-bottom:1rem;} .pb-5{padding-bottom:1.25rem;} .pt-1{padding-top:.25rem;} .pt-2{padding-top:.5rem;}
  .px-2\.5{padding-inline:.625rem;} .px-3{padding-inline:.75rem;} .px-4{padding-inline:1rem;} .px-5{padding-inline:1.25rem;} .px-6{padding-inline:1.5rem;}
  .py-1{padding-block:.25rem;} .py-1\.5{padding-block:.375rem;} .py-14{padding-block:3.5rem;} .py-2{padding-block:.5rem;} .py-2\.5{padding-block:.625rem;} .py-3{padding-block:.75rem;} .py-3\.5{padding-block:.875rem;} .py-4{padding-block:1rem;} .py-5{padding-block:1.25rem;} .py-6{padding-block:1.5rem;} .py-8{padding-block:2rem;}

  @media (min-width:640px){
    .sm\:p-8{padding:2rem;}
  }
  @media (min-width:768px){
    .md\:flex{display:flex;} .md\:hidden{display:none;}
    .md\:grid-cols-2{grid-template-columns:repeat(2,1fr);}
    .md\:col-span-2{grid-column:span 2 / span 2;}
    .md\:p-6{padding:1.5rem;} .md\:p-7{padding:1.75rem;} .md\:px-7{padding-inline:1.75rem;}
    .md\:text-lg{font-size:1.125rem;} .md\:text-xl{font-size:1.25rem;}
  }
</style>
</head>
<body>

<div id="app" class="min-h-screen flex items-center justify-center">
  <div class="flex flex-col items-center gap-3" style="color:var(--ink-soft)">
    <svg class="spin" width="34" height="34" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="var(--brand)" stroke-width="3" stroke-linecap="round" stroke-dasharray="40" stroke-dashoffset="10"/></svg>
    <div class="text-sm">جارِ التحميل…</div>
  </div>
</div>

<script type="module">
/* ============================= FIREBASE ============================= */
import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
  signInWithEmailAndPassword, signOut, updateProfile,
  setPersistence, browserSessionPersistence
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, getDoc,
  onSnapshot, query, where, orderBy, limit
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD-4YAtzuOHW8PPCQX_FkniQovAAoNOesk",
  authDomain: "medical-cards-ccc2b.firebaseapp.com",
  projectId: "medical-cards-ccc2b",
  storageBucket: "medical-cards-ccc2b.firebasestorage.app",
  messagingSenderId: "490583563573",
  appId: "1:490583563573:web:fa4ab2b8ff2954d055007c",
  measurementId: "G-8V20CJTE6M"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
// كل تبويب/نافذة يحتفظ بجلسته الخاصة (sessionStorage) بدل مشاركة نفس الجلسة
// بين كل تبويبات المتصفح (وهو سلوك Firebase الافتراضي عبر localStorage).
// بهذا تقدر تفتح حسابين مختلفين في تبويبين مختلفين من نفس المتصفح.
setPersistence(auth, browserSessionPersistence).catch(()=>{});

/* ============================= CONFIG ============================= */
const STATUS = {
  new:       { label: 'طلب جديد',              tint:'var(--amber-tint)', fg:'var(--amber)' },
  sent:      { label: 'بانتظار مراجعة المركز',   tint:'var(--blue-tint)',  fg:'var(--blue)'  },
  accepted:  { label: 'تم قبول الطلب',           tint:'var(--brand-tint)', fg:'var(--brand)' },
  rejected:  { label: 'تم رفض الطلب',            tint:'var(--red-tint)',   fg:'var(--red)'   },
  attended:  { label: 'حضر الموظف',              tint:'var(--violet-tint)',fg:'var(--violet)'},
  examined:  { label: 'تم الفحص',                tint:'var(--green-tint)', fg:'var(--green)' },
  completed: { label: 'مكتمل',                   tint:'var(--teal-solid)', fg:'#fff'         },
};
const ROLE_LABEL = { hr: 'مسؤول الموارد البشرية', reception: 'استقبال المركز الطبي', sales: 'موظف المبيعات' };
const REQTYPE = {
  new:     { label: 'جديد',  tint:'var(--blue-tint)',   fg:'var(--blue)'   },
  renewal: { label: 'تجديد', tint:'var(--violet-tint)', fg:'var(--violet)' },
};
function reqTypeBadge(r){
  const t = REQTYPE[r.requestType] || REQTYPE.new;
  return `<span class="badge" style="background:${t.tint};color:${t.fg}">${t.label}</span>`;
}

/* ============================= STATE ============================= */
const S = {
  me:{ uid:null, name:'', email:'' },
  role:null,
  requests:[], notifications:[], companies:[], sponsors:[], users:[],
  unsubs:[],
  tab:null,
  filters:{ q:'', status:'', company:'', sponsor:'', from:'', to:'' },
  notifOpen:false,
  completedMonth:null,
  pendingPhotoURL:null, photoUploadPromise:null,
  editPendingPhotoURL:null, editPhotoUploadPromise:null,
};

const $ = sel => document.querySelector(sel);

const fmtD = iso => { if(!iso) return '—'; try{ return new Intl.DateTimeFormat('ar', {calendar:'gregory', day:'2-digit', month:'2-digit', year:'numeric'}).format(new Date(iso)); }catch(e){ return iso; } };

  return `MED-${ymd}-${Math.random().toString(36).slice(2,6).toUpperCase()}`;

/* ============================= SESSION TIMEOUT (20 min inactivity) =============================
   Firebase Auth otherwise keeps a device signed in indefinitely. This layer forces a fresh
   login after 20 minutes with no real user interaction (click/tap/keypress), on this device. */
const SESSION_MAX_AGE_MS = 20 * 60 * 1000;
const SESSION_KEY = 'masar_last_activity';
let sessionInterval = null;
let sessionListenersAttached = false;
function touchSession(){ try{ localStorage.setItem(SESSION_KEY, String(Date.now())); }catch(e){} }
function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }
function isSessionExpired(){
  let last = 0;
  try{ last = Number(localStorage.getItem(SESSION_KEY) || 0); }catch(e){}
  // لا يوجد سجل نشاط سابق = جلسة دخول جديدة فعلاً (وليست جلسة قديمة عائدة) -> غير منتهية
  if(!last) return false;
  return (Date.now() - last) > SESSION_MAX_AGE_MS;
}
function onUserActivity(){ if(auth.currentUser) touchSession(); }
function startSessionWatch(){
  if(!sessionListenersAttached){
    ['click','keydown','touchstart'].forEach(evt => document.addEventListener(evt, onUserActivity, {passive:true}));
    sessionListenersAttached = true;
  }
  if(sessionInterval) clearInterval(sessionInterval);
  sessionInterval = setInterval(()=>{
    if(isSessionExpired()){
      stopSessionWatch();
      clearSession();
      toast('تم تسجيل الخروج تلقائياً لعدم النشاط لمدة 20 دقيقة','error');
      signOut(auth);
    }
  }, 15000);
}
function stopSessionWatch(){
  if(sessionInterval){ clearInterval(sessionInterval); sessionInterval = null; }
}

onAuthStateChanged(auth, async (user)=>{
  clearSubs();
  stopSessionWatch();
  if(!user){ clearSession(); renderAuthScreen(); return; }
  if(isSessionExpired()){
    clearSession();
    await signOut(auth);
    return; // will re-trigger this callback with user === null
  }
  touchSession();
  S.me.uid = user.uid; S.me.email = user.email || '';
  try{
    const uSnap = await getDoc(doc(db,'users',user.uid));
    if(uSnap.exists()){
      S.me.name = uSnap.data().name || user.displayName || '';
      S.role = uSnap.data().role;
      startApp();
    } else {
      // authenticated but no profile doc (shouldn't normally happen since
      // accounts are only created by HR through the app) -> block access
      S.me.name = user.displayName || '';
      renderNoProfileScreen();
    }
  }catch(e){
    console.error(e);
    renderAuthScreen(`تعذّر الاتصال بقاعدة البيانات. تأكد من إعداد Firestore وقواعد الحماية. — رمز الخطأ: ${e.code || e.message || 'غير معروف'}`);
  }
});

/* ---- Photo handling: resize + compress locally in the browser, store as a
   data URL directly inside the Firestore document. No Firebase Storage
   involved at all, so it stays fully free on the Spark plan. ---- */
function resizeImageToDataURL(file, maxDim=320, quality=0.72){
  return new Promise((resolve, reject)=>{
    if(!file.type || !file.type.startsWith('image/')){ reject(new Error('not-image')); return; }
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('read-failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('decode-failed'));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w >= h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else{ if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        try{
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          if(dataUrl.length > 700000){ reject(new Error('too-large')); return; }
          resolve(dataUrl);
        }catch(e){ reject(e); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function photoErrorMessage(err){
  const code = err && err.message;
  if(code === 'not-image') return 'الملف المختار ليس صورة.';
  if(code === 'too-large') return 'الصورة كبيرة جداً حتى بعد الضغط — جرّب صورة أخرى.';
  return 'تعذّرت معالجة الصورة — جرّب صورة أخرى.';
}

function renderTab(){
  if(!S.tab) return;
  if(S.tab==='new' && S.role!=='hr'){ S.tab='dashboard'; }
  if(S.tab==='users' && !(S.role==='hr'||S.role==='sales')){ S.tab='dashboard'; }
  if(S.tab==='dashboard') return renderDashboard();
  if(S.tab==='new') return renderNewRequest();
  if(S.tab==='log') return renderLog();
  if(S.tab==='inbox') return renderInbox();
  if(S.tab==='users') return renderUsersAdmin();
  if(S.tab==='completed') return renderCompleted();
}

/* ---------------- HR: Import requests from any Excel file ---------------- */
function normalizeHeader(h){
  return String(h||'').trim().toLowerCase()
    .replace(/[\u064B-\u0652]/g,'')
    .replace(/[إأآا]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')
    .replace(/[_\-\/]/g,' ')
    .replace(/\s+/g,' ').trim();
}
const IMPORT_FIELD_LABELS = { employeeNameAr:'اسم الموظف', employeeNameEn:'الاسم بالإنجليزي', idNumber:'رقم الهوية', sponsorName:'الكفيل', companyName:'الشركة', billingCompany:'جهة الفاتورة', examType:'نوع الفحص', notes:'ملاحظات' };
const IMPORT_FIELD_SYNONYMS = {
  employeeNameAr: ['اسم الموظف','الموظف','اسم الموظف بالعربي','اسم الموظف عربي','الاسم','اسم','name','employee','employee name','full name'],
  employeeNameEn: ['الاسم بالانجليزي','اسم الموظف بالانجليزي','اسم انجليزي','name en','english name','employee name en'],
  idNumber: ['رقم الهويه','الهويه','هويه','رقم الاقامه','الاقامه','اقامه','رقم الهويه الاقامه','id','id number','iqama','national id','identity number'],
  sponsorName: ['الكفيل','كفيل','اسم الكفيل','sponsor','sponsor name'],
  companyName: ['الشركه','شركه','اسم الشركه','جهه العمل','company','company name','employer'],
  billingCompany: ['الفاتوره','فاتوره باسم','تصدر الفاتوره','الشركه الفاتوره','فاتوره تحت مسمى','تحت مسمى','billing','billing company','invoice company'],
  examType: ['نوع الفحص','الفحص','نوع الكشف','exam type','exam'],
  notes: ['ملاحظات','ملاحظه','notes','note'],
};
function matchColumn(headers, field){
  const syns = IMPORT_FIELD_SYNONYMS[field];
  const normHeaders = headers.map(h=>({orig:h, norm:normalizeHeader(h)}));
  for(const s of syns){ const sn = normalizeHeader(s); const hit = normHeaders.find(h=>h.norm===sn); if(hit) return hit.orig; }
  for(const s of syns){ const sn = normalizeHeader(s); const hit = normHeaders.find(h=>h.norm.includes(sn) || sn.includes(h.norm)); if(hit) return hit.orig; }
  return null;
}
function openImportModal(){
  if(typeof XLSX === 'undefined'){ toast('تعذّر تحميل مكتبة قراءة الإكسل — تحقق من الاتصال بالإنترنت','error'); return; }
  const wrap = el('div','modal-backdrop');
  wrap.innerHTML = `
    <div class="card p-5 w-full max-w-lg fade-in" style="max-height:90vh;overflow:auto">
      <h3 class="font-bold mb-2">استيراد طلبات من ملف إكسل</h3>
      <p class="text-xs mb-4" style="color:var(--ink-soft)">اختر أي ملف إكسل (xlsx أو xls أو csv) بأي ترتيب أعمدة — سيتعرّف النظام تلقائياً على أعمدة اسم الموظف، رقم الهوية، الكفيل، الشركة، وجهة الفاتورة من عناوين الأعمدة، ويتجاهل أي أعمدة أخرى غير معروفة.</p>
      <input type="file" id="importFile" accept=".xlsx,.xls,.csv">
      <div id="importStatus" class="text-sm mt-3" style="color:var(--ink-soft)"></div>
      <div id="importPreviewWrap"></div>
      <div class="flex gap-2 mt-4">
        <button id="importConfirmBtn" class="btn btn-brand px-5 py-2.5 text-sm flex-1 hidden">تأكيد الاستيراد</button>
        <button id="importCancelBtn" class="btn btn-ghost px-5 py-2.5 text-sm">إلغاء</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  wrap.onclick = (e)=>{ if(e.target===wrap) wrap.remove(); };
  wrap.querySelector('#importCancelBtn').onclick = ()=>wrap.remove();

  let parsedRows = [];

  wrap.querySelector('#importFile').addEventListener('change', (e)=>{
    const f = e.target.files[0]; if(!f) return;
    const statusEl = wrap.querySelector('#importStatus');
    const previewEl = wrap.querySelector('#importPreviewWrap');
    const confirmBtn = wrap.querySelector('#importConfirmBtn');
    statusEl.textContent = 'جارِ قراءة الملف…';
    confirmBtn.classList.add('hidden');
    previewEl.innerHTML = '';
    const reader = new FileReader();
    reader.onerror = ()=>{ statusEl.innerHTML = `<span style="color:var(--red)">تعذّر قراءة الملف</span>`; };
    reader.onload = (ev)=>{
      try{
        const wb = XLSX.read(ev.target.result, {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
        if(!rows.length){ statusEl.innerHTML = `<span style="color:var(--red)">الملف فارغ أو بدون بيانات قابلة للقراءة</span>`; return; }
        const headers = Object.keys(rows[0]);
        const mapping = {};
        Object.keys(IMPORT_FIELD_LABELS).forEach(f=>{ mapping[f] = matchColumn(headers, f); });

        parsedRows = [];
        let skipped = 0;
        rows.forEach(row=>{
          const get = f => mapping[f] ? String(row[mapping[f]] ?? '').trim() : '';
          const employeeNameAr = get('employeeNameAr');
          const idNumber = get('idNumber');
          if(!employeeNameAr || !idNumber){ skipped++; return; }
          const companyName = get('companyName') || '—';
          parsedRows.push({
            employeeNameAr, employeeNameEn: get('employeeNameEn'), idNumber,
            sponsorName: get('sponsorName') || '—', companyName,
            billingCompany: get('billingCompany') || companyName,
            examType: get('examType'), notes: get('notes'),
          });
        });

        const mappingLines = Object.entries(mapping).map(([f,h])=>
          `<div class="flex items-center justify-between text-xs" style="padding:.2rem 0;"><span style="color:var(--ink-soft)">${IMPORT_FIELD_LABELS[f]}</span><span class="font-bold" style="color:${h?'var(--brand)':'var(--ink-soft)'}">${h? esc(h) : '— لم يُكتشف —'}</span></div>`
        ).join('');

        statusEl.innerHTML = `تم العثور على <b>${rows.length}</b> صف — سيتم استيراد <b style="color:var(--brand)">${parsedRows.length}</b> طلب${skipped? `، وتجاهل <b style="color:var(--red)">${skipped}</b> صف لنقص اسم الموظف أو رقم الهوية.` : '.'}`;
        previewEl.innerHTML = `
          <div class="card p-3 mt-3" style="background:var(--surface-2)">
            <div class="text-xs font-bold mb-2">الأعمدة المكتشفة تلقائياً:</div>
            ${mappingLines}
          </div>
          ${parsedRows.length? `<div class="scrollx mt-3"><table class="rtable"><thead><tr><th>الموظف</th><th>الهوية</th><th>الشركة</th></tr></thead><tbody>
            ${parsedRows.slice(0,5).map(r=>`<tr><td>${esc(r.employeeNameAr)}</td><td>${esc(r.idNumber)}</td><td>${esc(r.companyName)}</td></tr>`).join('')}
          </tbody></table></div>${parsedRows.length>5? `<div class="text-xs mt-1" style="color:var(--ink-soft)">و${parsedRows.length-5} صف آخر…</div>`:''}` : ''}
        `;
        if(parsedRows.length) confirmBtn.classList.remove('hidden');
      }catch(err){
        console.error(err);
        statusEl.innerHTML = `<span style="color:var(--red)">تعذّر قراءة الملف — تأكد أنه ملف إكسل أو CSV صالح</span>`;
      }
    };
    reader.readAsArrayBuffer(f);
  });

  wrap.querySelector('#importConfirmBtn').onclick = async ()=>{
    if(!parsedRows.length) return;
    const confirmBtn = wrap.querySelector('#importConfirmBtn');
    const statusEl = wrap.querySelector('#importStatus');
    confirmBtn.disabled = true; confirmBtn.textContent = 'جارِ الاستيراد…';
    let done = 0;
    for(const row of parsedRows){
      try{
        const reqNumber = genReqNumber();
        const docData = {
          requestNumber: reqNumber,
          employeeNameAr: row.employeeNameAr, employeeNameEn: row.employeeNameEn || '',
          idNumber: row.idNumber, photoURL: null,
          sponsorName: row.sponsorName, companyName: row.companyName, billingCompany: row.billingCompany,
          examType: row.examType || '', notes: row.notes || '',
          status: 'sent', rejectionReason: '',
          createdAt: nowISO(), createdBy: S.me.uid, createdByName: S.me.name || '',
          updatedAt: nowISO(),
        };
        const refDoc = await addDoc(collection(db,'requests'), docData);
        await Promise.all([
          maybeAddLookup('companies', docData.companyName),
          maybeAddLookup('companies', docData.billingCompany),
          maybeAddLookup('sponsors', docData.sponsorName),
        ]);
        await addLog(refDoc.id, reqNumber, 'تم استيراد الطلب من ملف إكسل', `بواسطة ${S.me.name || ''}`);
      }catch(err){ console.error('import row failed', err); }
      done++;
      statusEl.textContent = `جارِ الاستيراد… ${done} / ${parsedRows.length}`;
    }
    try{ await notify({ toRole:'reception', requestId:null, requestNumber:null, message:`تم استيراد ${done} طلب فحص جديد من ملف إكسل` }); }catch(e){}
    toast(`تم استيراد ${done} طلب بنجاح`);
    wrap.remove();
  };
}

async function doAccept(id){

  try{
    await updateDoc(doc(db,'requests',id), { status:'accepted', acceptedAt:nowISO(), acceptedBy:S.me.uid, acceptedByName:S.me.name||'', updatedAt:nowISO() });

    await notify({ toUserId:r.createdBy, requestId:id, requestNumber:r.requestNumber, message:`تم قبول طلب الفحص رقم ${r.requestNumber} — ${r.employeeNameAr}` });

async function doTransition(id, status, atField, byField, nameField, msg){

    </div>` : ''}
    <div class="card p-4 mb-4">
      <div class="filters-grid">
        <div><label class="field-label">بحث</label><input id="fq" placeholder="اسم، هوية، رقم طلب" value="${esc(S.filters.q)}"></div>
        <div><label class="field-label">الحالة</label><select id="fstatus">
          <option value="" ${S.filters.status===''?'selected':''}>الكل</option>
          <option value="pending_review" ${S.filters.status==='pending_review'?'selected':''}>قيد المراجعة</option>
          <option value="attended_examined" ${S.filters.status==='attended_examined'?'selected':''}>حضر أصحابها</option>
          ${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${S.filters.status===k?'selected':''}>${v.label}</option>`).join('')}
        </select></div>
        <div><label class="field-label">الشركة</label><select id="fcompany"><option value="">الكل</option>${companies.map(c=>`<option ${S.filters.company===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
        <div><label class="field-label">الكفيل</label><select id="fsponsor"><option value="">الكل</option>${sponsors.map(c=>`<option ${S.filters.sponsor===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
        <div><label class="field-label">من تاريخ</label><input type="date" id="ffrom" value="${S.filters.from}"></div>
        <div><label class="field-label">إلى تاريخ</label><input type="date" id="fto" value="${S.filters.to}"></div>
      </div>
    </div>
    <div class="card overflow-hidden" id="logTableWrap"></div>`;
  if(S.role==='hr'){ const btn = $('#openImportBtn'); if(btn) btn.onclick = openImportModal; }
  const apply = ()=>{
    S.filters = { q: $('#fq').value.trim(), status: $('#fstatus').value, company: $('#fcompany').value, sponsor: $('#fsponsor').value, from: $('#ffrom').value, to: $('#fto').value };
    renderLogTable();
  };
  ['fq','fstatus','fcompany','fsponsor','ffrom','fto'].forEach(id=>{ $('#'+id).addEventListener('input', apply); $('#'+id).addEventListener('change', apply); });
  renderLogTable();
}
function renderLogTable(){
  const wrap = $('#logTableWrap'); if(!wrap) return;
  const f = S.filters;
  let items = S.requests.slice();
  if(f.q){ const q = f.q.toLowerCase(); items = items.filter(r => [r.employeeNameAr,r.employeeNameEn,r.idNumber,r.requestNumber].some(v=> (v||'').toLowerCase().includes(q))); }
  if(f.status === 'pending_review') items = items.filter(r=> r.status==='sent' || r.status==='new');
  else if(f.status === 'attended_examined') items = items.filter(r=> r.status==='attended' || r.status==='examined');
  else if(f.status) items = items.filter(r=>r.status===f.status);
  if(f.company) items = items.filter(r=>r.companyName===f.company);
  if(f.sponsor) items = items.filter(r=>r.sponsorName===f.sponsor);
  if(f.from) items = items.filter(r=> r.createdAt && r.createdAt.slice(0,10) >= f.from);
  if(f.to) items = items.filter(r=> r.createdAt && r.createdAt.slice(0,10) <= f.to);
  wrap.innerHTML = requestsTable(items);
  wireRequestTableEvents();
}

    <thead><tr>
      <th>الموظف</th><th>رقم الطلب</th>
      <th class="hide-sm">الهوية</th><th class="hide-sm">الكفيل</th><th class="hide-sm">الشركة</th>
      <th>الحالة</th><th class="hide-sm">تاريخ الطلب</th><th class="hide-sm"></th>
    </tr></thead>
    <tbody>
      ${items.map(r=>{
        const st = STATUS[r.status]||STATUS.sent;
        const photo = r.photoURL

          : `<div class="avatar flex items-center justify-center" style="width:30px;height:30px;color:var(--ink-soft)">${iconUser}</div>`;
        return `<tr class="rt-row" data-openreq="${r.id}">
        <td class="rt-emp">${photo}<span class="font-bold">${esc(r.employeeNameAr)}</span></td>

        <td><div class="flex flex-col gap-1"><span class="badge" style="background:${st.tint};color:${st.fg}">${st.label}</span>${reqTypeBadge(r)}</div></td>
        <td class="hide-sm" style="color:var(--ink-soft)">${fmtD(r.createdAt)}</td>
        <td class="hide-sm rt-actions">
          <div class="flex items-center gap-1.5 justify-end">
            <button class="btn btn-ghost px-2.5 py-1 text-xs" data-openreq="${r.id}">تفاصيل</button>
            ${S.role==='hr' ? `
            <button class="btn btn-ghost px-2.5 py-1 text-xs" data-edit="${r.id}" title="تعديل">${iconEdit}</button>
            <button class="btn btn-ghost px-2.5 py-1 text-xs" data-del="${r.id}" title="حذف" style="color:var(--red)">${iconTrash}</button>` : ''}
          </div>
        </td></tr>`;
      }).join('')}

/* ---------------- Completed requests (grouped by month) ---------------- */
function renderCompleted(){
  const body = $('#pageBody'); if(!body) return;
  const completed = S.requests.filter(r=>r.status==='completed');

  // Group by year-month of the request's creation date (e.g. "2026-09")
  const groups = {};
  completed.forEach(r=>{
    if(!r.createdAt) return;
    const key = r.createdAt.slice(0,7);
    (groups[key] = groups[key] || []).push(r);
  });
  const monthKeys = Object.keys(groups).sort((a,b)=> b.localeCompare(a));

  if(!monthKeys.length){
    body.innerHTML = `<div class="card overflow-hidden">${emptyState('لا توجد طلبات مكتملة بعد', 'ستظهر هنا الطلبات المكتملة مجمّعة حسب شهر تقديمها.')}</div>`;
    return;
  }
  if(!S.completedMonth || !groups[S.completedMonth]) S.completedMonth = monthKeys[0];

  const monthLabel = key=>{
    const [y,m] = key.split('-').map(Number);
    return new Intl.DateTimeFormat('ar', {calendar:'gregory', month:'long', year:'numeric'}).format(new Date(y, m-1, 1));
  };

  body.innerHTML = `
    <div class="flex flex-wrap gap-2 mb-5">
      ${monthKeys.map(k=>`<button class="btn ${k===S.completedMonth?'btn-brand':'btn-ghost'} px-4 py-2 text-sm" data-month="${k}" style="border-radius:999px;">
        ${esc(monthLabel(k))} <span style="opacity:.85">(${groups[k].length})</span>
      </button>`).join('')}
    </div>
    <div class="card overflow-hidden">${requestsTable(groups[S.completedMonth].slice().sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||'')))}</div>`;

  document.querySelectorAll('[data-month]').forEach(btn=>{
    btn.onclick = ()=>{ S.completedMonth = btn.dataset.month; renderCompleted(); };
  });
  wireRequestTableEvents();
}

function wireRequestTableEvents(){
  document.querySelectorAll('[data-openreq]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); openDetailModal(el.dataset.openreq); };
  });
  document.querySelectorAll('[data-edit]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); openEditModal(el.dataset.edit); };
  });
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); openDeleteConfirm(el.dataset.del); };
  });
}

/* ---------------- Detail modal ---------------- */
function openDetailModal(id){
  const r = S.requests.find(x=>x.id===id); if(!r) return;
  const st = STATUS[r.status]||STATUS.sent;
  const wrap = el('div','modal-backdrop');
  const photo = r.photoURL ? `<img src="${r.photoURL}" class="avatar" style="width:64px;height:64px">` : `<div class="avatar flex items-center justify-center" style="width:64px;height:64px;color:var(--ink-soft)">${iconUser}</div>`;

  let actionsHTML = '';
  if(S.role==='reception'){
    if(r.status==='sent') actionsHTML = `<button class="btn btn-brand px-4 py-2 text-sm" data-action="accept" data-id="${r.id}">قبول الطلب</button><button class="btn btn-danger px-4 py-2 text-sm" data-action="reject" data-id="${r.id}">رفض الطلب</button>`;
    else if(r.status==='accepted') actionsHTML = `<button class="btn btn-brand px-4 py-2 text-sm" data-action="checkin" data-id="${r.id}">تسجيل حضور الموظف</button>`;
    else if(r.status==='attended') actionsHTML = `<button class="btn btn-brand px-4 py-2 text-sm" data-action="examine" data-id="${r.id}">تم الفحص</button>`;
    else if(r.status==='examined') actionsHTML = `<button class="btn btn-brand px-4 py-2 text-sm" data-action="complete" data-id="${r.id}">إكمال الطلب</button>`;
  }
  if(S.role==='hr' || S.role==='sales'){
    actionsHTML += `<button class="btn btn-ghost px-4 py-2 text-sm" data-action="edit" data-id="${r.id}">${iconEdit}<span class="mr-1">تعديل الطلب</span></button>`;
  }
  if(S.role==='hr'){
    actionsHTML += `<button class="btn btn-ghost px-4 py-2 text-sm" data-action="delete" data-id="${r.id}" style="color:var(--red)">${iconTrash}<span class="mr-1">حذف الطلب</span></button>`;
  }

  wrap.innerHTML = `
    <div class="card p-5 w-full max-w-lg fade-in" style="max-height:88vh;overflow:auto">
      <div class="flex items-start justify-between gap-3 mb-4">
        <div class="flex items-center gap-3">${photo}<div><div class="font-bold">${esc(r.employeeNameAr)}</div><div class="text-xs" style="color:var(--ink-soft)">${esc(r.employeeNameEn||'')}</div></div></div>
        <div class="flex flex-col items-end gap-1">
          <span class="badge" style="background:${st.tint};color:${st.fg}">${st.label}</span>
          ${reqTypeBadge(r)}
        </div>
      </div>
      <div class="grid grid-cols-2 gap-y-2 text-sm mb-3">
        <div><span style="color:var(--ink-soft)">رقم الطلب: </span><b>${esc(r.requestNumber)}</b></div>
        <div><span style="color:var(--ink-soft)">الهوية: </span>${esc(r.idNumber)}</div>
        <div><span style="color:var(--ink-soft)">الكفيل: </span>${esc(r.sponsorName)}</div>
        <div><span style="color:var(--ink-soft)">الشركة: </span>${esc(r.companyName)}</div>
        <div class="col-span-2"><span style="color:var(--ink-soft)">فاتورة باسم: </span>${esc(r.billingCompany)}</div>
        <div class="col-span-2"><span style="color:var(--ink-soft)">نوع الفحص: </span>${esc(r.examType||'—')}</div>
        ${r.notes? `<div class="col-span-2"><span style="color:var(--ink-soft)">ملاحظات: </span>${esc(r.notes)}</div>`:''}
        ${r.status==='rejected' && r.rejectionReason ? `<div class="col-span-2 p-2 rounded-lg" style="background:var(--red-tint);color:var(--red)"><b>سبب الرفض:</b> ${esc(r.rejectionReason)}</div>` : ''}
      </div>
      <div class="text-xs mb-4" style="color:var(--ink-soft)">
        <div>تاريخ الطلب: ${fmtDT(r.createdAt)} — بواسطة ${esc(r.createdByName||'—')}</div>
        ${r.acceptedAt? `<div>تاريخ القبول: ${fmtDT(r.acceptedAt)} — بواسطة ${esc(r.acceptedByName||'—')}</div>`:''}
        ${r.checkinAt? `<div>تاريخ حضور الموظف: ${fmtDT(r.checkinAt)}</div>`:''}
        ${r.examinedAt? `<div>تاريخ الفحص: ${fmtDT(r.examinedAt)}</div>`:''}
        ${r.completedAt? `<div>تاريخ الإكمال: ${fmtDT(r.completedAt)}</div>`:''}
        ${r.rejectedAt? `<div>تاريخ الرفض: ${fmtDT(r.rejectedAt)} — بواسطة ${esc(r.rejectedByName||'—')}</div>`:''}
      </div>
      ${actionsHTML? `<div class="flex flex-wrap gap-2 pt-2" style="border-top:1px solid var(--line)">${actionsHTML}</div>`:''}
      <button id="closeModalBtn" class="btn btn-ghost px-4 py-2 text-sm mt-4 w-full">إغلاق</button>
    </div>`;
  document.body.appendChild(wrap);
  wrap.onclick = (e)=>{ if(e.target===wrap) wrap.remove(); };
  wrap.querySelector('#closeModalBtn').onclick = ()=>wrap.remove();
  wrap.querySelectorAll('[data-action="accept"]').forEach(b=>b.onclick=()=>{ doAccept(b.dataset.id); wrap.remove(); });
  wrap.querySelectorAll('[data-action="reject"]').forEach(b=>b.onclick=()=>{ wrap.remove(); openRejectModal(b.dataset.id); });
  wrap.querySelectorAll('[data-action="checkin"]').forEach(b=>b.onclick=()=>doTransition(b.dataset.id,'attended','checkinAt','checkinBy','checkinByName','تم تسجيل حضور الموظف'));
  wrap.querySelectorAll('[data-action="examine"]').forEach(b=>b.onclick=()=>doTransition(b.dataset.id,'examined','examinedAt','examinedBy','examinedByName','تم إجراء الفحص'));
  wrap.querySelectorAll('[data-action="complete"]').forEach(b=>b.onclick=()=>doTransition(b.dataset.id,'completed','completedAt','completedBy','completedByName','تم إكمال الطلب'));
  wrap.querySelectorAll('[data-action="edit"]').forEach(b=>b.onclick=()=>{ wrap.remove(); openEditModal(b.dataset.id); });
  wrap.querySelectorAll('[data-action="delete"]').forEach(b=>b.onclick=()=>{ wrap.remove(); openDeleteConfirm(b.dataset.id); });
}

/* ---------------- HR: Full Edit modal ---------------- */
function openEditModal(id){
  const r = S.requests.find(x=>x.id===id); if(!r) return;
  S.editPendingPhotoURL = r.photoURL || null;
  S.editPhotoUploadPromise = null;
  const wrap = el('div','modal-backdrop');
  const photo = r.photoURL ? `<img src="${r.photoURL}" class="avatar" style="width:64px;height:64px">` : `<span style="color:var(--ink-soft)">${iconUser}</span>`;

  wrap.innerHTML = `
    <div class="card p-5 w-full max-w-lg fade-in" style="max-height:92vh;overflow:auto">
      <h3 class="font-bold mb-4">تعديل الطلب — ${esc(r.requestNumber)}</h3>
      <form id="editForm" class="grid gap-4">
        <div>
          <label class="field-label">نوع الطلب</label>
          <select name="requestType">
            <option value="new" ${(!r.requestType||r.requestType==='new')?'selected':''}>جديد</option>
            <option value="renewal" ${r.requestType==='renewal'?'selected':''}>تجديد</option>
          </select>
        </div>
        <div class="grid md:grid-cols-2 gap-4">
          <div><label class="field-label">اسم الموظف (عربي) *</label><input required name="employeeNameAr" value="${esc(r.employeeNameAr)}"></div>
          <div><label class="field-label">اسم الموظف (إنجليزي)</label><input name="employeeNameEn" value="${esc(r.employeeNameEn||'')}"></div>
        </div>
        <div class="grid md:grid-cols-2 gap-4">
          <div><label class="field-label">رقم الهوية / الإقامة *</label><input required name="idNumber" value="${esc(r.idNumber)}"></div>
          <div><label class="field-label">نوع الفحص الطبي</label><input name="examType" value="${esc(r.examType||'')}"></div>
        </div>
        <div class="grid md:grid-cols-2 gap-4">
          <div><label class="field-label">اسم الكفيل *</label><input required list="editSponsorsList" name="sponsorName" value="${esc(r.sponsorName)}"><datalist id="editSponsorsList"></datalist></div>
          <div><label class="field-label">اسم الشركة *</label><input required list="editCompaniesList" name="companyName" value="${esc(r.companyName)}"><datalist id="editCompaniesList"></datalist></div>
        </div>
        <div><label class="field-label">الشركة التي سيتم إصدار الفاتورة باسمها *</label><input required list="editBillingList" name="billingCompany" value="${esc(r.billingCompany)}"><datalist id="editBillingList"></datalist></div>
        <div>
          <label class="field-label">صورة الموظف</label>
          <div class="flex items-center gap-3">
            <div id="editPhotoPreviewWrap" class="avatar flex items-center justify-center overflow-hidden" style="width:64px;height:64px">${photo}</div>
            <label class="btn btn-ghost px-3 py-2 text-sm cursor-pointer">تغيير الصورة<input type="file" id="editPhotoInput" accept="image/*" class="hidden"></label>
            <span id="editPhotoStatus" class="text-xs" style="color:var(--ink-soft)"></span>
          </div>
        </div>
        <div><label class="field-label">ملاحظات</label><textarea name="notes" rows="2">${esc(r.notes||'')}</textarea></div>
        <div class="grid md:grid-cols-2 gap-4 pt-2" style="border-top:1px solid var(--line)">
          <div>
            <label class="field-label">حالة الطلب</label>
            <select name="status">
              ${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${r.status===k?'selected':''}>${v.label}</option>`).join('')}
            </select>
          </div>
          <div><label class="field-label">سبب الرفض (إن وجد)</label><input name="rejectionReason" value="${esc(r.rejectionReason||'')}"></div>
        </div>
        <p class="text-xs" style="color:var(--ink-soft)">تعديل الحالة هنا يدوي وخارج سير العمل المعتاد بين HR والاستقبال — استخدمه فقط لتصحيح الأخطاء.</p>
        <div class="flex gap-2 pt-2">
          <button type="submit" id="editSaveBtn" class="btn btn-brand px-5 py-2.5 text-sm flex-1">حفظ التعديلات</button>
          <button type="button" id="editCancelBtn" class="btn btn-ghost px-5 py-2.5 text-sm">إلغاء</button>
        </div>
      </form>
    </div>`;
  document.body.appendChild(wrap);
  wrap.onclick = (e)=>{ if(e.target===wrap) wrap.remove(); };
  wrap.querySelector('#editCancelBtn').onclick = ()=>wrap.remove();
  wrap.querySelector('#editSponsorsList').innerHTML = S.sponsors.map(x=>`<option value="${esc(x)}">`).join('');
  wrap.querySelector('#editCompaniesList').innerHTML = S.companies.map(x=>`<option value="${esc(x)}">`).join('');
  wrap.querySelector('#editBillingList').innerHTML = S.companies.map(x=>`<option value="${esc(x)}">`).join('');

  wrap.querySelector('#editPhotoInput').addEventListener('change', (e)=>{
    const f = e.target.files[0]; if(!f) return;
    const statusEl = wrap.querySelector('#editPhotoStatus');
    const saveBtn = wrap.querySelector('#editSaveBtn');
    statusEl.textContent = 'جارِ معالجة الصورة…'; saveBtn.disabled = true;
    S.editPhotoUploadPromise = (async ()=>{
      try{
        const url = await resizeImageToDataURL(f);
        S.editPendingPhotoURL = url;
        wrap.querySelector('#editPhotoPreviewWrap').innerHTML = `<img src="${url}" class="avatar" style="width:64px;height:64px">`;
        statusEl.textContent = 'تم تجهيز الصورة ✓';
        return url;
      }catch(err){ console.error(err); statusEl.textContent='تعذّر معالجة الصورة'; toast(photoErrorMessage(err),'error'); throw err; }
      finally{ saveBtn.disabled = false; }
    })();
  });

  wrap.querySelector('#editForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = Object.fromEntries(fd.entries());
    if(!data.employeeNameAr || !data.idNumber || !data.sponsorName || !data.companyName || !data.billingCompany){
      toast('الرجاء تعبئة الحقول المطلوبة (*)','error'); return;
    }
    const saveBtn = wrap.querySelector('#editSaveBtn');
    if(S.editPhotoUploadPromise){
      saveBtn.disabled = true; saveBtn.textContent = 'جارِ تجهيز الصورة…';
      try{ await S.editPhotoUploadPromise; }
      catch(err){ saveBtn.disabled=false; saveBtn.textContent='حفظ التعديلات'; toast('تعذّر تجهيز الصورة، أعد المحاولة قبل الحفظ','error'); return; }
    }
    saveBtn.disabled = true; saveBtn.textContent = 'جارِ الحفظ…';
    try{
      const updates = {
        requestType: data.requestType === 'renewal' ? 'renewal' : 'new',
        employeeNameAr: data.employeeNameAr.trim(),
        employeeNameEn: (data.employeeNameEn||'').trim(),
        idNumber: data.idNumber.trim(),
        sponsorName: data.sponsorName.trim(),
        companyName: data.companyName.trim(),
        billingCompany: data.billingCompany.trim(),
        examType: (data.examType||'').trim(),
        notes: (data.notes||'').trim(),
        status: data.status,
        rejectionReason: (data.rejectionReason||'').trim(),
        photoURL: S.editPendingPhotoURL,
        updatedAt: nowISO(),
      };
      await updateDoc(doc(db,'requests',id), updates);
      await Promise.all([
        maybeAddLookup('companies', updates.companyName),
        maybeAddLookup('companies', updates.billingCompany),
        maybeAddLookup('sponsors', updates.sponsorName),
      ]);
      await addLog(id, r.requestNumber, 'تم تعديل بيانات الطلب بواسطة HR', `بواسطة ${S.me.name||''}`);
      toast('تم حفظ التعديلات'); wrap.remove();
    }catch(err){ console.error(err); toast('تعذّر حفظ التعديلات','error'); saveBtn.disabled=false; saveBtn.textContent='حفظ التعديلات'; }
  });
}
