<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسار — إدارة طلبات الفحص الطبي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --ink:#16231F; --ink-soft:#4C5E58; --line:#DEE7E2;
    --bg:#F4F8F6; --surface:#FFFFFF; --surface-2:#EEF4F1;
    --brand:#0E6B5C; --brand-dark:#0A4E43; --brand-tint:#E3F2EE;
    --amber:#B9852B; --amber-tint:#FBF1DF;
    --blue:#3468A0; --blue-tint:#E7EFF7;
    --violet:#6B5AA6; --violet-tint:#EEEBF8;
    --green:#2D8A54; --green-tint:#E5F4EA;
    --red:#B8473B; --red-tint:#FBEAE8;
    --teal-solid:#0E6B5C;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#EAF1EE; --ink-soft:#A9BBB4; --line:#26332F;
      --bg:#101915; --surface:#16211C; --surface-2:#1C2823;
      --brand:#3FAE93; --brand-dark:#2C8A73; --brand-tint:#17332B;
      --amber:#D8A94E; --amber-tint:#2E2712;
      --blue:#79A6D6; --blue-tint:#16273A;
      --violet:#A996E0; --violet-tint:#251E3A;
      --green:#6FC495; --green-tint:#132A1D;
      --red:#E0847A; --red-tint:#331917;
      --teal-solid:#3FAE93;
    }
  }
  html,body{height:100%;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    background:var(--bg); color:var(--ink); font-family:'Tajawal',sans-serif; -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    overflow-x:hidden;
  }
  h1,h2,h3,.brandfont{font-family:'Cairo',sans-serif;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:14px;}
  .btn{border-radius:10px; font-weight:700; transition:transform .08s ease, opacity .15s ease; white-space:nowrap;}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.55; cursor:not-allowed;}
  .btn-brand{background:var(--brand); color:#fff;}
  .btn-brand:hover{background:var(--brand-dark);}
  .btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-danger{background:var(--red); color:#fff;}
  .btn-danger:hover{opacity:.9;}
  input,select,textarea{
    background:var(--surface); color:var(--ink); border:1px solid var(--line);
    border-radius:10px; padding:.6rem .8rem; width:100%; font-family:inherit; font-size:1rem;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brand); outline-offset:1px; border-color:var(--brand);}
  label.field-label{font-size:.8rem; color:var(--ink-soft); font-weight:700; margin-bottom:.3rem; display:block;}
  .badge{display:inline-flex; align-items:center; gap:.35rem; padding:.28rem .7rem; border-radius:999px; font-size:.78rem; font-weight:700; white-space:nowrap;}
  .navlink{display:flex; align-items:center; gap:.65rem; padding:.7rem .9rem; border-radius:10px; color:var(--ink-soft); font-weight:700; font-size:.9rem; cursor:pointer; min-height:44px;}
  .navlink:hover{background:var(--surface-2); color:var(--ink);}
  .navlink.active{background:var(--brand-tint); color:var(--brand-dark);}
  .scrollx{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  table{border-collapse:collapse; width:100%;}
  th{font-size:.76rem; color:var(--ink-soft); font-weight:700; text-align:right; padding:.6rem .8rem; border-bottom:1px solid var(--line); white-space:nowrap;}
  td{padding:.65rem .8rem; border-bottom:1px solid var(--line); font-size:.87rem; vertical-align:middle;}
  tr:hover td{background:var(--surface-2);}
  /* Card-style table on phones: rows become stacked key/value cards instead of a squeezed, scrolling grid */
  @media (max-width: 680px){
    table.rtable thead{ display:none; }
    table.rtable, table.rtable tbody, table.rtable tr, table.rtable td{ display:block; width:100%; }
    table.rtable{ display:flex; flex-direction:column; gap:10px; }
    table.rtable tr{ border:1px solid var(--line); border-radius:12px; padding:.65rem .9rem; background:var(--surface); }
    table.rtable tr:hover td{ background:transparent; }
    table.rtable td{ border:none; padding:.3rem 0; display:flex; justify-content:space-between; align-items:center; gap:.75rem; font-size:.86rem; }
    table.rtable td::before{ content:attr(data-label); font-weight:700; color:var(--ink-soft); font-size:.74rem; flex-shrink:0; }
    table.rtable td[data-label]:empty::before{ content:none; }
    table.rtable td.rt-actions{ justify-content:flex-end; padding-top:.5rem; }
    table.rtable td.rt-actions::before{ content:none; }
    .scrollx{ overflow-x:visible; }
  }
  .modal-backdrop{position:fixed; inset:0; background:rgba(10,20,17,.5); backdrop-filter:blur(2px); z-index:50; display:flex; align-items:center; justify-content:center; padding:1rem;}
  .avatar{width:44px; height:44px; border-radius:50%; object-fit:cover; background:var(--surface-2); border:1px solid var(--line);}
  .spin{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .fade-in{animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
  ::-webkit-scrollbar{height:8px; width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px;}
  .stat-num{font-family:'Cairo',sans-serif; font-weight:800; font-size:1.7rem;}
  .stat-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:.75rem; }
  @media (min-width:640px){ .stat-grid{ grid-template-columns:repeat(3,1fr); gap:.9rem; } }
  @media (min-width:1024px){ .stat-grid{ grid-template-columns:repeat(6,1fr); } }
  .filters-grid{ display:grid; grid-template-columns:1fr 1fr; gap:.75rem; }
  @media (min-width:640px){ .filters-grid{ grid-template-columns:repeat(3,1fr); } }
  @media (min-width:1024px){ .filters-grid{ grid-template-columns:repeat(6,1fr); } }
  .cards-grid{ display:grid; grid-template-columns:1fr; gap:1rem; }
  @media (min-width:640px){ .cards-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (min-width:1280px){ .cards-grid{ grid-template-columns:repeat(3,1fr); } }
  .err-box{background:var(--red-tint); color:var(--red); border-radius:10px; padding:.6rem .8rem; font-size:.8rem;}
</style>
</head>
<body>

<div id="app" class="min-h-screen flex items-center justify-center">
  <div class="flex flex-col items-center gap-3" style="color:var(--ink-soft)">
    <svg class="spin" width="34" height="34" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="var(--brand)" stroke-width="3" stroke-linecap="round" stroke-dasharray="40" stroke-dashoffset="10"/></svg>
    <div class="text-sm">جارِ التحميل…</div>
  </div>
</div>

<script type="module">
/* ============================= FIREBASE ============================= */
import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
  signInWithEmailAndPassword, signOut, updateProfile
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, collection, doc, addDoc, setDoc, updateDoc, getDoc,
  onSnapshot, query, where, orderBy, limit
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD-4YAtzuOHW8PPCQX_FkniQovAAoNOesk",
  authDomain: "medical-cards-ccc2b.firebaseapp.com",
  projectId: "medical-cards-ccc2b",
  storageBucket: "medical-cards-ccc2b.firebasestorage.app",
  messagingSenderId: "490583563573",
  appId: "1:490583563573:web:fa4ab2b8ff2954d055007c",
  measurementId: "G-8V20CJTE6M"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

/* ============================= CONFIG ============================= */
const STATUS = {
  new:       { label: 'طلب جديد',              tint:'var(--amber-tint)', fg:'var(--amber)' },
  sent:      { label: 'بانتظار مراجعة المركز',   tint:'var(--blue-tint)',  fg:'var(--blue)'  },
  accepted:  { label: 'تم قبول الطلب',           tint:'var(--brand-tint)', fg:'var(--brand)' },
  rejected:  { label: 'تم رفض الطلب',            tint:'var(--red-tint)',   fg:'var(--red)'   },
  attended:  { label: 'حضر الموظف',              tint:'var(--violet-tint)',fg:'var(--violet)'},
  examined:  { label: 'تم الفحص',                tint:'var(--green-tint)', fg:'var(--green)' },
  completed: { label: 'مكتمل',                   tint:'var(--teal-solid)', fg:'#fff'         },
};
const ROLE_LABEL = { hr: 'مسؤول الموارد البشرية', reception: 'استقبال المركز الطبي' };

/* ============================= STATE ============================= */
const S = {
  me:{ uid:null, name:'', email:'' },
  role:null,
  requests:[], notifications:[], companies:[], sponsors:[], users:[],
  unsubs:[],
  tab:null,
  filters:{ q:'', status:'', company:'', sponsor:'', from:'', to:'' },
  notifOpen:false,
  pendingPhotoURL:null, photoUploadPromise:null,
  editPendingPhotoURL:null, editPhotoUploadPromise:null,
};

const $ = sel => document.querySelector(sel);
const el = (tag, cls, html) => { const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; };
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDT = iso => { if(!iso) return '—'; try{ return new Intl.DateTimeFormat('ar', {calendar:'gregory', day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}).format(new Date(iso)); }catch(e){ return iso; } };
const fmtD = iso => { if(!iso) return '—'; try{ return new Intl.DateTimeFormat('ar', {calendar:'gregory', day:'2-digit', month:'2-digit', year:'numeric'}).format(new Date(iso)); }catch(e){ return iso; } };
const nowISO = () => new Date().toISOString();
const genReqNumber = () => {
  const d = new Date(); const p = n => String(n).padStart(2,'0');
  const ymd = `${String(d.getFullYear()).slice(2)}${p(d.getMonth()+1)}${p(d.getDate())}`;
  return `MED-${ymd}-${Math.random().toString(36).slice(2,6).toUpperCase()}`;
};
function toast(msg, kind){
  const box = $('#toastbox') || (()=>{ const b=el('div',''); b.id='toastbox'; b.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;'; document.body.appendChild(b); return b; })();
  const t = el('div','fade-in', esc(msg));
  t.style.cssText = `background:${kind==='error'?'var(--red)':'var(--brand-dark)'};color:#fff;padding:.6rem 1.1rem;border-radius:10px;font-size:.85rem;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.18);`;
  box.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 2600);
}
function arError(code){
  const map = {
    'auth/invalid-email':'صيغة البريد الإلكتروني غير صحيحة',
    'auth/user-not-found':'لا يوجد حساب بهذا البريد',
    'auth/wrong-password':'كلمة المرور غير صحيحة',
    'auth/invalid-credential':'بيانات الدخول غير صحيحة',
    'auth/email-already-in-use':'هذا البريد مستخدم بالفعل',
    'auth/weak-password':'كلمة المرور ضعيفة (6 أحرف على الأقل)',
    'auth/too-many-requests':'محاولات كثيرة، حاول لاحقاً',
  };
  return map[code] || 'حدث خطأ، حاول مرة أخرى';
}

/* ============================= AUTH FLOW ============================= */
onAuthStateChanged(auth, async (user)=>{
  clearSubs();
  if(!user){ renderAuthScreen(); return; }
  S.me.uid = user.uid; S.me.email = user.email || '';
  try{
    const uSnap = await getDoc(doc(db,'users',user.uid));
    if(uSnap.exists()){
      S.me.name = uSnap.data().name || user.displayName || '';
      S.role = uSnap.data().role;
      startApp();
    } else {
      // authenticated but no profile doc (shouldn't normally happen since
      // accounts are only created by HR through the app) -> block access
      S.me.name = user.displayName || '';
      renderNoProfileScreen();
    }
  }catch(e){
    console.error(e);
    renderAuthScreen('تعذّر الاتصال بقاعدة البيانات. تأكد من إعداد Firestore وقواعد الحماية.');
  }
});

function renderAuthScreen(errMsg){
  $('#app').innerHTML = `
  <div class="w-full min-h-screen flex items-center justify-center p-4">
    <div class="card p-6 sm:p-8 max-w-md w-full fade-in">
      <div class="flex items-center gap-3 mb-1">
        <div style="width:40px;height:40px;border-radius:11px;background:var(--brand);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-family:'Cairo',sans-serif">م</div>
        <h1 class="text-xl font-bold brandfont">مسار</h1>
      </div>
      <p class="text-sm mb-6" style="color:var(--ink-soft)">إدارة طلبات الفحص الطبي للموظفين</p>

      <div id="errSlot" class="mb-3">${errMsg? `<div class="err-box">${esc(errMsg)}</div>`:''}</div>

      <form id="loginForm" class="grid gap-3">
        <div><label class="field-label">البريد الإلكتروني</label><input required type="email" name="email"></div>
        <div><label class="field-label">كلمة المرور</label><input required type="password" name="password"></div>
        <button type="submit" id="loginBtn" class="btn btn-brand py-2.5 mt-1">دخول</button>
      </form>
      <p class="text-xs mt-5 text-center" style="color:var(--ink-soft)">الحسابات تُنشأ فقط من قِبل مسؤول الموارد البشرية. إذا لم يكن لديك حساب تواصل معه.</p>
    </div>
  </div>`;

  $('#loginForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const btn = $('#loginBtn'); btn.disabled = true; btn.textContent = 'جارِ الدخول…';
    try{
      await signInWithEmailAndPassword(auth, fd.get('email'), fd.get('password'));
    }catch(err){
      console.error(err);
      $('#errSlot').innerHTML = `<div class="err-box">${esc(arError(err.code))}</div>`;
    }finally{ btn.disabled=false; btn.textContent='دخول'; }
  });
}

function renderNoProfileScreen(){
  $('#app').innerHTML = `
  <div class="w-full min-h-screen flex items-center justify-center p-4">
    <div class="card p-6 sm:p-8 max-w-md w-full fade-in text-center">
      <h1 class="text-lg font-bold brandfont mb-2">لم يتم العثور على حساب لك</h1>
      <p class="text-sm mb-6" style="color:var(--ink-soft)">حسابك مُسجَّل للدخول لكن لا يوجد له ملف صفة داخل النظام. تواصل مع مسؤول الموارد البشرية لإنشاء حسابك بالصفة الصحيحة.</p>
      <button id="signoutBtn2" class="btn btn-ghost px-5 py-2.5 text-sm">تسجيل الخروج</button>
    </div>
  </div>`;
  $('#signoutBtn2').onclick = ()=>signOut(auth);
}

/* ============================= APP SHELL ============================= */
function clearSubs(){ S.unsubs.forEach(u=>{ try{u();}catch(e){} }); S.unsubs = []; }

function startApp(){
  S.tab = S.role==='hr' ? 'dashboard' : 'inbox';
  buildShell();
  subscribeAll();
}

function buildShell(){
  const isHR = S.role==='hr';
  const navItems = isHR ? [
    {id:'dashboard', label:'لوحة التحكم', icon:iconGrid},
    {id:'new', label:'طلب فحص جديد', icon:iconPlus},
    {id:'log', label:'سجل الطلبات', icon:iconList},
    {id:'users', label:'إدارة المستخدمين', icon:iconUsers},
  ] : [
    {id:'inbox', label:'الطلبات الواردة', icon:iconInbox},
    {id:'log', label:'جميع الطلبات', icon:iconList},
  ];

  $('#app').innerHTML = `
  <div class="min-h-screen flex">
    <aside class="hidden md:flex flex-col shrink-0" style="width:236px;border-left:1px solid var(--line);background:var(--surface)">
      <div class="flex items-center gap-3 px-5 py-5">
        <div style="width:38px;height:38px;border-radius:10px;background:var(--brand);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-family:'Cairo',sans-serif">م</div>
        <div><div class="font-bold brandfont leading-none">مسار</div><div class="text-[11px]" style="color:var(--ink-soft)">إدارة الفحوصات الطبية</div></div>
      </div>
      <nav class="flex flex-col gap-1 px-3 mt-2">
        ${navItems.map(n=>`<div class="navlink" data-tab="${n.id}">${n.icon}<span>${n.label}</span></div>`).join('')}
      </nav>
      <div class="mt-auto px-3 pb-5">
        <div class="rounded-xl p-3 flex items-center gap-2" style="background:var(--surface-2)">
          <div class="avatar flex items-center justify-center font-bold" style="color:var(--brand)">${esc((S.me.name||'؟').slice(0,1))}</div>
          <div class="min-w-0">
            <div class="text-xs font-bold truncate">${esc(S.me.name||'مستخدم')}</div>
            <div class="text-[11px]" style="color:var(--ink-soft)">${esc(ROLE_LABEL[S.role])}</div>
          </div>
        </div>
        <button id="logoutBtn" class="text-[11px] mt-2 w-full text-center py-1.5" style="color:var(--ink-soft)">تسجيل الخروج</button>
      </div>
    </aside>

    <div class="flex-1 min-w-0 flex flex-col">
      <header class="flex items-center justify-between gap-3 px-4 md:px-7 py-3.5" style="border-bottom:1px solid var(--line);background:var(--surface)">
        <div class="flex items-center gap-3 min-w-0">
          <button id="mobileMenuBtn" class="md:hidden btn-ghost btn p-2">${iconMenu}</button>
          <h2 id="pageTitle" class="font-bold text-base md:text-lg truncate"></h2>
        </div>
        <div class="relative">
          <button id="notifBtn" class="btn-ghost btn p-2 relative">${iconBell}
            <span id="notifDot" class="hidden" style="position:absolute;top:-3px;left:-3px;background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 3px;"></span>
          </button>
          <div id="notifPanel" class="hidden" style="position:absolute;left:0;top:calc(100% + 8px);width:340px;max-width:88vw;max-height:70vh;overflow:auto;z-index:40;"></div>
        </div>
      </header>
      <main id="pageBody" class="flex-1 p-4 md:p-7 min-w-0"></main>
    </div>
  </div>

  <div id="mobileNav" class="hidden md:hidden" style="position:fixed;inset:0;z-index:60;">
    <div class="absolute inset-0" style="background:rgba(0,0,0,.4)" id="mobileNavBackdrop"></div>
    <div class="absolute top-0 bottom-0 right-0" style="width:78%;max-width:300px;background:var(--surface);padding:1.2rem 1rem;">
      <div class="flex items-center gap-3 mb-4">
        <div style="width:36px;height:36px;border-radius:10px;background:var(--brand);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-family:'Cairo',sans-serif">م</div>
        <div class="font-bold brandfont">مسار</div>
      </div>
      <nav class="flex flex-col gap-1" id="navlinksMobile">
        ${navItems.map(n=>`<div class="navlink" data-tab="${n.id}">${n.icon}<span>${n.label}</span></div>`).join('')}
      </nav>
      <button id="logoutBtnMobile" class="text-xs mt-4 w-full text-center py-2" style="color:var(--ink-soft)">تسجيل الخروج</button>
    </div>
  </div>`;

  document.querySelectorAll('[data-tab]').forEach(n=>n.onclick=()=>{ setTab(n.dataset.tab); closeMobileNav(); });
  $('#mobileMenuBtn').onclick = ()=> $('#mobileNav').classList.remove('hidden');
  $('#mobileNavBackdrop').onclick = closeMobileNav;
  $('#logoutBtn').onclick = ()=>signOut(auth);
  $('#logoutBtnMobile').onclick = ()=>signOut(auth);
  $('#notifBtn').onclick = toggleNotifPanel;
  setTab(S.tab);
}
function closeMobileNav(){ $('#mobileNav').classList.add('hidden'); }

function setTab(tab){
  S.tab = tab;
  document.querySelectorAll('[data-tab]').forEach(n=> n.classList.toggle('active', n.dataset.tab===tab));
  const titles = { dashboard:'لوحة التحكم', new:'إنشاء طلب فحص طبي جديد', log:'سجل الطلبات', inbox:'الطلبات الواردة', users:'إدارة المستخدمين' };
  $('#pageTitle').textContent = titles[tab] || '';
  renderTab();
}

/* ============================= DATA SUBSCRIBE ============================= */
function subscribeAll(){
  const reqQ = query(collection(db,'requests'), orderBy('createdAt','desc'), limit(1000));
  S.unsubs.push(onSnapshot(reqQ, snap=>{
    S.requests = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    renderTab(); renderNotifPanel();
  }, e=>console.error('requests sub', e)));

  const notifQ = query(collection(db,'notifications'), orderBy('createdAt','desc'), limit(200));
  S.unsubs.push(onSnapshot(notifQ, snap=>{
    S.notifications = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    updateNotifDot(); renderNotifPanel();
  }, e=>console.error('notif sub', e)));

  const compQ = query(collection(db,'companies'), orderBy('name','asc'), limit(500));
  S.unsubs.push(onSnapshot(compQ, snap=>{
    S.companies = snap.docs.map(d=>d.data().name).filter(Boolean);
    refreshDatalists();
  }, e=>console.error('companies sub', e)));

  const spQ = query(collection(db,'sponsors'), orderBy('name','asc'), limit(500));
  S.unsubs.push(onSnapshot(spQ, snap=>{
    S.sponsors = snap.docs.map(d=>d.data().name).filter(Boolean);
    refreshDatalists();
  }, e=>console.error('sponsors sub', e)));

  if(S.role==='hr'){
    const usersQ = query(collection(db,'users'), orderBy('createdAt','desc'), limit(500));
    S.unsubs.push(onSnapshot(usersQ, snap=>{
      S.users = snap.docs.map(d=>({ id:d.id, ...d.data() }));

/* ---- Photo handling: resize + compress locally in the browser, store as a
   data URL directly inside the Firestore document. No Firebase Storage
   involved at all, so it stays fully free on the Spark plan. ---- */
function resizeImageToDataURL(file, maxDim=320, quality=0.72){
  return new Promise((resolve, reject)=>{
    if(!file.type || !file.type.startsWith('image/')){ reject(new Error('not-image')); return; }
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('read-failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('decode-failed'));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w >= h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else{ if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        try{
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          if(dataUrl.length > 700000){ reject(new Error('too-large')); return; }
          resolve(dataUrl);
        }catch(e){ reject(e); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function photoErrorMessage(err){
  const code = err && err.message;
  if(code === 'not-image') return 'الملف المختار ليس صورة.';
  if(code === 'too-large') return 'الصورة كبيرة جداً حتى بعد الضغط — جرّب صورة أخرى.';
  return 'تعذّرت معالجة الصورة — جرّب صورة أخرى.';
}

async function doTransition(id, status, atField, byField, nameField, msg){

    await addLog(id, r.requestNumber, msg, '');

      await notify({ toUserId:r.createdBy, requestId:id, requestNumber:r.requestNumber, message:`اكتمل طلب الفحص رقم ${r.requestNumber} — ${r.employeeNameAr}` });

              <td data-label="الصفة"><span class="badge" style="background:${u.role==='hr'?'var(--brand-tint)':'var(--blue-tint)'};color:${u.role==='hr'?'var(--brand)':'var(--blue)'}">${esc(ROLE_LABEL[u.role]||u.role||'—')}</span></td>
              <td data-label="تاريخ الإنشاء" style="color:var(--ink-soft)">${fmtD(u.createdAt)}</td>
            </tr>`).join('') : `<tr><td colspan="4" class="text-center py-6" style="color:var(--ink-soft)">لا يوجد مستخدمون بعد</td></tr>`}
          </tbody>
        </table></div>
      </div>
    </div>`;

  $('#newUserForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const name = fd.get('name').trim(), email = fd.get('email').trim(), password = fd.get('password'), role = fd.get('role');
    const btn = $('#createUserBtn'); const msg = $('#newUserMsg');
    btn.disabled = true; btn.textContent = 'جارِ الإنشاء…'; msg.textContent = '';

    // Create the auth account on a throwaway secondary Firebase app instance
    // so this does NOT replace the currently signed-in HR session.
    let secondaryApp;
    try{
      secondaryApp = initializeApp(firebaseConfig, 'UserCreator-' + Date.now());
      const secondaryAuth = getAuth(secondaryApp);
      const cred = await createUserWithEmailAndPassword(secondaryAuth, email, password);
      await updateProfile(cred.user, { displayName: name });
      const newUid = cred.user.uid;
      await signOut(secondaryAuth);
      await setDoc(doc(db,'users',newUid), { name, email, role, createdAt: nowISO(), createdBy: S.me.uid });
      await addDoc(collection(db,'logs'), { requestId:null, requestNumber:null, action:'تم إنشاء حساب مستخدم', details:`${name} (${email}) — ${ROLE_LABEL[role]}`, byUserId:S.me.uid, byUserName:S.me.name||'', role:S.role, at:nowISO() });
      toast(`تم إنشاء حساب ${name} بنجاح`);
      e.target.reset();
    }catch(err){
      console.error(err);
      msg.innerHTML = `<span style="color:var(--red)">${esc(arError(err.code))}</span>`;
    }finally{
      if(secondaryApp){ try{ await deleteApp(secondaryApp); }catch(e){} }
      btn.disabled = false; btn.textContent = 'إنشاء الحساب';
    }
  });
}

/* ---------------- Shared: Requests Log ---------------- */
function renderLog(){
  const body = $('#pageBody'); if(!body) return;
  const companies = Array.from(new Set(S.requests.map(r=>r.companyName).filter(Boolean))).sort();
  const sponsors = Array.from(new Set(S.requests.map(r=>r.sponsorName).filter(Boolean))).sort();
  body.innerHTML = `
    <div class="card p-4 mb-4">
      <div class="filters-grid">
        <div><label class="field-label">بحث</label><input id="fq" placeholder="اسم، هوية، رقم طلب" value="${esc(S.filters.q)}"></div>
        <div><label class="field-label">الحالة</label><select id="fstatus"><option value="">الكل</option>${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${S.filters.status===k?'selected':''}>${v.label}</option>`).join('')}</select></div>
        <div><label class="field-label">الشركة</label><select id="fcompany"><option value="">الكل</option>${companies.map(c=>`<option ${S.filters.company===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
        <div><label class="field-label">الكفيل</label><select id="fsponsor"><option value="">الكل</option>${sponsors.map(c=>`<option ${S.filters.sponsor===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
        <div><label class="field-label">من تاريخ</label><input type="date" id="ffrom" value="${S.filters.from}"></div>
        <div><label class="field-label">إلى تاريخ</label><input type="date" id="fto" value="${S.filters.to}"></div>
      </div>
    </div>
    <div class="card overflow-hidden" id="logTableWrap"></div>`;
  const apply = ()=>{
    S.filters = { q: $('#fq').value.trim(), status: $('#fstatus').value, company: $('#fcompany').value, sponsor: $('#fsponsor').value, from: $('#ffrom').value, to: $('#fto').value };
    renderLogTable();
  };
  ['fq','fstatus','fcompany','fsponsor','ffrom','fto'].forEach(id=>{ $('#'+id).addEventListener('input', apply); $('#'+id).addEventListener('change', apply); });
  renderLogTable();
}
function renderLogTable(){
  const wrap = $('#logTableWrap'); if(!wrap) return;
  const f = S.filters;
  let items = S.requests.slice();
  if(f.q){ const q = f.q.toLowerCase(); items = items.filter(r => [r.employeeNameAr,r.employeeNameEn,r.idNumber,r.requestNumber].some(v=> (v||'').toLowerCase().includes(q))); }
  if(f.status) items = items.filter(r=>r.status===f.status);
  if(f.company) items = items.filter(r=>r.companyName===f.company);
  if(f.sponsor) items = items.filter(r=>r.sponsorName===f.sponsor);
  if(f.from) items = items.filter(r=> r.createdAt && r.createdAt.slice(0,10) >= f.from);
  if(f.to) items = items.filter(r=> r.createdAt && r.createdAt.slice(0,10) <= f.to);
  wrap.innerHTML = requestsTable(items);
  wireRequestTableEvents();
}
function requestsTable(items){
  if(!items.length) return emptyState('لا توجد طلبات مطابقة', 'جرّب تعديل عوامل البحث أعلاه.');
  return `
  <div class="scrollx"><table class="rtable">
    <thead><tr><th>رقم الطلب</th><th>الموظف</th><th>الهوية</th><th>الكفيل</th><th>الشركة</th><th>الحالة</th><th>تاريخ الطلب</th><th></th></tr></thead>
    <tbody>
      ${items.map(r=>{ const st = STATUS[r.status]||STATUS.sent; return `<tr>
        <td data-label="رقم الطلب" class="font-bold">${esc(r.requestNumber)}</td>
        <td data-label="الموظف">${esc(r.employeeNameAr)}</td>
        <td data-label="الهوية">${esc(r.idNumber)}</td>
        <td data-label="الكفيل">${esc(r.sponsorName)}</td>
        <td data-label="الشركة">${esc(r.companyName)}</td>
        <td data-label="الحالة"><span class="badge" style="background:${st.tint};color:${st.fg}">${st.label}</span></td>
        <td data-label="التاريخ" style="color:var(--ink-soft)">${fmtD(r.createdAt)}</td>
        <td class="rt-actions"><button class="btn btn-ghost px-2.5 py-1 text-xs" data-openreq="${r.id}">تفاصيل</button></td></tr>`; }).join('')}
    </tbody>
  </table></div>`;
}
function wireRequestTableEvents(){ document.querySelectorAll('[data-openreq]').forEach(b=>b.onclick=()=>openDetailModal(b.dataset.openreq)); }
function emptyState(title, sub){
  return `<div class="text-center py-14 px-4">
    <div class="mx-auto mb-3" style="width:52px;height:52px;border-radius:14px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--ink-soft)">${iconInbox}</div>
    <div class="font-bold text-sm mb-1">${esc(title)}</div><div class="text-xs" style="color:var(--ink-soft)">${esc(sub)}</div></div>`;
}

/* ---------------- Detail modal ---------------- */
function openDetailModal(id){
  const r = S.requests.find(x=>x.id===id); if(!r) return;
  const st = STATUS[r.status]||STATUS.sent;
  const wrap = el('div','modal-backdrop');
  const photo = r.photoURL ? `<img src="${r.photoURL}" class="avatar" style="width:64px;height:64px">` : `<div class="avatar flex items-center justify-center" style="width:64px;height:64px;color:var(--ink-soft)">${iconUser}</div>`;

  let actionsHTML = '';
  if(S.role==='reception'){
    if(r.status==='sent') actionsHTML = `<button class="btn btn-brand px-4 py-2 text-sm" data-action="accept" data-id="${r.id}">قبول الطلب</button><button class="btn btn-danger px-4 py-2 text-sm" data-action="reject" data-id="${r.id}">رفض الطلب</button>`;
    else if(r.status==='accepted') actionsHTML = `<button class="btn btn-brand px-4 py-2 text-sm" data-action="checkin" data-id="${r.id}">تسجيل حضور الموظف</button>`;
    else if(r.status==='attended') actionsHTML = `<button class="btn btn-brand px-4 py-2 text-sm" data-action="examine" data-id="${r.id}">تم الفحص</button>`;
    else if(r.status==='examined') actionsHTML = `<button class="btn btn-brand px-4 py-2 text-sm" data-action="complete" data-id="${r.id}">إكمال الطلب</button>`;
  }
  if(S.role==='hr'){
    actionsHTML += `<button class="btn btn-ghost px-4 py-2 text-sm" data-action="edit" data-id="${r.id}">${iconEdit}<span class="mr-1">تعديل الطلب</span></button>`;
  }

  wrap.innerHTML = `
    <div class="card p-5 w-full max-w-lg fade-in" style="max-height:88vh;overflow:auto">
      <div class="flex items-start justify-between gap-3 mb-4">
        <div class="flex items-center gap-3">${photo}<div><div class="font-bold">${esc(r.employeeNameAr)}</div><div class="text-xs" style="color:var(--ink-soft)">${esc(r.employeeNameEn||'')}</div></div></div>
        <span class="badge" style="background:${st.tint};color:${st.fg}">${st.label}</span>
      </div>
      <div class="grid grid-cols-2 gap-y-2 text-sm mb-3">
        <div><span style="color:var(--ink-soft)">رقم الطلب: </span><b>${esc(r.requestNumber)}</b></div>
        <div><span style="color:var(--ink-soft)">الهوية: </span>${esc(r.idNumber)}</div>
        <div><span style="color:var(--ink-soft)">الكفيل: </span>${esc(r.sponsorName)}</div>
        <div><span style="color:var(--ink-soft)">الشركة: </span>${esc(r.companyName)}</div>
        <div class="col-span-2"><span style="color:var(--ink-soft)">فاتورة باسم: </span>${esc(r.billingCompany)}</div>
        <div class="col-span-2"><span style="color:var(--ink-soft)">نوع الفحص: </span>${esc(r.examType||'—')}</div>
        ${r.notes? `<div class="col-span-2"><span style="color:var(--ink-soft)">ملاحظات: </span>${esc(r.notes)}</div>`:''}
        ${r.status==='rejected' && r.rejectionReason ? `<div class="col-span-2 p-2 rounded-lg" style="background:var(--red-tint);color:var(--red)"><b>سبب الرفض:</b> ${esc(r.rejectionReason)}</div>` : ''}
      </div>
      <div class="text-xs mb-4" style="color:var(--ink-soft)">
        <div>تاريخ الطلب: ${fmtDT(r.createdAt)} — بواسطة ${esc(r.createdByName||'—')}</div>
        ${r.acceptedAt? `<div>تاريخ القبول: ${fmtDT(r.acceptedAt)} — بواسطة ${esc(r.acceptedByName||'—')}</div>`:''}
        ${r.checkinAt? `<div>تاريخ حضور الموظف: ${fmtDT(r.checkinAt)}</div>`:''}
        ${r.examinedAt? `<div>تاريخ الفحص: ${fmtDT(r.examinedAt)}</div>`:''}
        ${r.completedAt? `<div>تاريخ الإكمال: ${fmtDT(r.completedAt)}</div>`:''}
        ${r.rejectedAt? `<div>تاريخ الرفض: ${fmtDT(r.rejectedAt)} — بواسطة ${esc(r.rejectedByName||'—')}</div>`:''}
      </div>
      ${actionsHTML? `<div class="flex flex-wrap gap-2 pt-2" style="border-top:1px solid var(--line)">${actionsHTML}</div>`:''}
      <button id="closeModalBtn" class="btn btn-ghost px-4 py-2 text-sm mt-4 w-full">إغلاق</button>
    </div>`;
  document.body.appendChild(wrap);
  wrap.onclick = (e)=>{ if(e.target===wrap) wrap.remove(); };
  wrap.querySelector('#closeModalBtn').onclick = ()=>wrap.remove();
  wrap.querySelectorAll('[data-action="accept"]').forEach(b=>b.onclick=()=>{ doAccept(b.dataset.id); wrap.remove(); });
  wrap.querySelectorAll('[data-action="reject"]').forEach(b=>b.onclick=()=>{ wrap.remove(); openRejectModal(b.dataset.id); });
  wrap.querySelectorAll('[data-action="checkin"]').forEach(b=>b.onclick=()=>doTransition(b.dataset.id,'attended','checkinAt','checkinBy','checkinByName','تم تسجيل حضور الموظف'));
  wrap.querySelectorAll('[data-action="examine"]').forEach(b=>b.onclick=()=>doTransition(b.dataset.id,'examined','examinedAt','examinedBy','examinedByName','تم إجراء الفحص'));
  wrap.querySelectorAll('[data-action="complete"]').forEach(b=>b.onclick=()=>doTransition(b.dataset.id,'completed','completedAt','completedBy','completedByName','تم إكمال الطلب'));
  wrap.querySelectorAll('[data-action="edit"]').forEach(b=>b.onclick=()=>{ wrap.remove(); openEditModal(b.dataset.id); });
}

/* ---------------- HR: Full Edit modal ---------------- */
function openEditModal(id){
  const r = S.requests.find(x=>x.id===id); if(!r) return;
  S.editPendingPhotoURL = r.photoURL || null;
  S.editPhotoUploadPromise = null;
  const wrap = el('div','modal-backdrop');
  const photo = r.photoURL ? `<img src="${r.photoURL}" class="avatar" style="width:64px;height:64px">` : `<span style="color:var(--ink-soft)">${iconUser}</span>`;

  wrap.innerHTML = `
    <div class="card p-5 w-full max-w-lg fade-in" style="max-height:92vh;overflow:auto">
      <h3 class="font-bold mb-4">تعديل الطلب — ${esc(r.requestNumber)}</h3>
      <form id="editForm" class="grid gap-4">
        <div class="grid md:grid-cols-2 gap-4">
          <div><label class="field-label">اسم الموظف (عربي) *</label><input required name="employeeNameAr" value="${esc(r.employeeNameAr)}"></div>
          <div><label class="field-label">اسم الموظف (إنجليزي)</label><input name="employeeNameEn" value="${esc(r.employeeNameEn||'')}"></div>
        </div>
        <div class="grid md:grid-cols-2 gap-4">
          <div><label class="field-label">رقم الهوية / الإقامة *</label><input required name="idNumber" value="${esc(r.idNumber)}"></div>
          <div><label class="field-label">نوع الفحص الطبي</label><input name="examType" value="${esc(r.examType||'')}"></div>
        </div>
        <div class="grid md:grid-cols-2 gap-4">
          <div><label class="field-label">اسم الكفيل *</label><input required list="editSponsorsList" name="sponsorName" value="${esc(r.sponsorName)}"><datalist id="editSponsorsList"></datalist></div>
          <div><label class="field-label">اسم الشركة *</label><input required list="editCompaniesList" name="companyName" value="${esc(r.companyName)}"><datalist id="editCompaniesList"></datalist></div>
        </div>
        <div><label class="field-label">الشركة التي سيتم إصدار الفاتورة باسمها *</label><input required list="editBillingList" name="billingCompany" value="${esc(r.billingCompany)}"><datalist id="editBillingList"></datalist></div>
        <div>
          <label class="field-label">صورة الموظف</label>
          <div class="flex items-center gap-3">
            <div id="editPhotoPreviewWrap" class="avatar flex items-center justify-center overflow-hidden" style="width:64px;height:64px">${photo}</div>
            <label class="btn btn-ghost px-3 py-2 text-sm cursor-pointer">تغيير الصورة<input type="file" id="editPhotoInput" accept="image/*" class="hidden"></label>
            <span id="editPhotoStatus" class="text-xs" style="color:var(--ink-soft)"></span>
          </div>
        </div>
        <div><label class="field-label">ملاحظات</label><textarea name="notes" rows="2">${esc(r.notes||'')}</textarea></div>
        <div class="grid md:grid-cols-2 gap-4 pt-2" style="border-top:1px solid var(--line)">
          <div>
            <label class="field-label">حالة الطلب</label>
            <select name="status">
              ${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${r.status===k?'selected':''}>${v.label}</option>`).join('')}
            </select>
          </div>
          <div><label class="field-label">سبب الرفض (إن وجد)</label><input name="rejectionReason" value="${esc(r.rejectionReason||'')}"></div>
        </div>
        <p class="text-xs" style="color:var(--ink-soft)">تعديل الحالة هنا يدوي وخارج سير العمل المعتاد بين HR والاستقبال — استخدمه فقط لتصحيح الأخطاء.</p>
        <div class="flex gap-2 pt-2">
          <button type="submit" id="editSaveBtn" class="btn btn-brand px-5 py-2.5 text-sm flex-1">حفظ التعديلات</button>
          <button type="button" id="editCancelBtn" class="btn btn-ghost px-5 py-2.5 text-sm">إلغاء</button>
        </div>
      </form>
    </div>`;
  document.body.appendChild(wrap);
  wrap.onclick = (e)=>{ if(e.target===wrap) wrap.remove(); };
  wrap.querySelector('#editCancelBtn').onclick = ()=>wrap.remove();
  wrap.querySelector('#editSponsorsList').innerHTML = S.sponsors.map(x=>`<option value="${esc(x)}">`).join('');
  wrap.querySelector('#editCompaniesList').innerHTML = S.companies.map(x=>`<option value="${esc(x)}">`).join('');
  wrap.querySelector('#editBillingList').innerHTML = S.companies.map(x=>`<option value="${esc(x)}">`).join('');

  wrap.querySelector('#editPhotoInput').addEventListener('change', (e)=>{
    const f = e.target.files[0]; if(!f) return;
    const statusEl = wrap.querySelector('#editPhotoStatus');
    const saveBtn = wrap.querySelector('#editSaveBtn');
    statusEl.textContent = 'جارِ الرفع…'; saveBtn.disabled = true;
    S.editPhotoUploadPromise = (async ()=>{
      try{
        const url = await uploadEmployeePhoto(f);
        S.editPendingPhotoURL = url;
        wrap.querySelector('#editPhotoPreviewWrap').innerHTML = `<img src="${url}" class="avatar" style="width:64px;height:64px">`;
        statusEl.textContent = 'تم رفع الصورة ✓';
        return url;
      }catch(err){ console.error(err); statusEl.textContent='تعذّر رفع الصورة'; toast(photoErrorMessage(err),'error'); throw err; }
      finally{ saveBtn.disabled = false; }
    })();
  });

  wrap.querySelector('#editForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = Object.fromEntries(fd.entries());
    if(!data.employeeNameAr || !data.idNumber || !data.sponsorName || !data.companyName || !data.billingCompany){
      toast('الرجاء تعبئة الحقول المطلوبة (*)','error'); return;
    }
    const saveBtn = wrap.querySelector('#editSaveBtn');
    if(S.editPhotoUploadPromise){
      saveBtn.disabled = true; saveBtn.textContent = 'جارِ تجهيز الصورة…';
      try{ await S.editPhotoUploadPromise; }
      catch(err){ saveBtn.disabled=false; saveBtn.textContent='حفظ التعديلات'; toast('تعذّر تجهيز الصورة، أعد المحاولة قبل الحفظ','error'); return; }
    }
    saveBtn.disabled = true; saveBtn.textContent = 'جارِ الحفظ…';
    try{
      const updates = {
        employeeNameAr: data.employeeNameAr.trim(),
        employeeNameEn: (data.employeeNameEn||'').trim(),
        idNumber: data.idNumber.trim(),
        sponsorName: data.sponsorName.trim(),
        companyName: data.companyName.trim(),
        billingCompany: data.billingCompany.trim(),
        examType: (data.examType||'').trim(),
        notes: (data.notes||'').trim(),
        status: data.status,
        rejectionReason: (data.rejectionReason||'').trim(),
        photoURL: S.editPendingPhotoURL,
        updatedAt: nowISO(),
      };
      await updateDoc(doc(db,'requests',id), updates);
      await Promise.all([
        maybeAddLookup('companies', updates.companyName),
        maybeAddLookup('companies', updates.billingCompany),
        maybeAddLookup('sponsors', updates.sponsorName),
      ]);
      await addLog(id, r.requestNumber, 'تم تعديل بيانات الطلب بواسطة HR', `بواسطة ${S.me.name||''}`);
      toast('تم حفظ التعديلات'); wrap.remove();
    }catch(err){ console.error(err); toast('تعذّر حفظ التعديلات','error'); saveBtn.disabled=false; saveBtn.textContent='حفظ التعديلات'; }
  });
}
