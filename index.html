<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#16231F; --ink-soft:#4C5E58; --line:#DEE7E2;
    --bg:#F4F8F6; --surface:#FFFFFF; --surface-2:#EEF4F1;
    --brand:#0E6B5C; --brand-dark:#0A4E43; --brand-tint:#E3F2EE;
    --amber:#B9852B; --amber-tint:#FBF1DF;
    --blue:#3468A0; --blue-tint:#E7EFF7;
    --violet:#6B5AA6; --violet-tint:#EEEBF8;
    --green:#2D8A54; --green-tint:#E5F4EA;
    --red:#B8473B; --red-tint:#FBEAE8;
    --teal-solid:#0E6B5C;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#EAF1EE; --ink-soft:#A9BBB4; --line:#26332F;
      --bg:#101915; --surface:#16211C; --surface-2:#1C2823;
      --brand:#3FAE93; --brand-dark:#2C8A73; --brand-tint:#17332B;
      --amber:#D8A94E; --amber-tint:#2E2712;
      --blue:#79A6D6; --blue-tint:#16273A;
      --violet:#A996E0; --violet-tint:#251E3A;
      --green:#6FC495; --green-tint:#132A1D;
      --red:#E0847A; --red-tint:#331917;
      --teal-solid:#3FAE93;
    }
  }
  html,body{height:100%;}
  *,*::before,*::after{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    background:var(--bg); color:var(--ink); font-family:'Tajawal',sans-serif; -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    overflow-x:hidden;
  }
  h1,h2,h3,.brandfont{font-family:'Cairo',sans-serif;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:14px;}
  .btn{border-radius:10px; font-weight:700; transition:transform .08s ease, opacity .15s ease; white-space:nowrap;}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.55; cursor:not-allowed;}
  .btn-brand{background:var(--brand); color:#fff;}
  .btn-brand:hover{background:var(--brand-dark);}
  .btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-danger{background:var(--red); color:#fff;}
  .req-type-btn{background:var(--surface-2); color:var(--ink-soft); border:1.5px solid var(--line); padding:.6rem .8rem;}
  .req-type-btn.active{background:var(--brand); color:#fff; border-color:var(--brand);}
  .btn-danger:hover{opacity:.9;}
  input,select,textarea{
    background:var(--surface); color:var(--ink); border:1px solid var(--line);
    border-radius:10px; padding:.6rem .8rem; width:100%; font-family:inherit; font-size:1rem;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brand); outline-offset:1px; border-color:var(--brand);}
  label.field-label{font-size:.8rem; color:var(--ink-soft); font-weight:700; margin-bottom:.3rem; display:block;}
  .badge{display:inline-flex; align-items:center; gap:.35rem; padding:.28rem .7rem; border-radius:999px; font-size:.78rem; font-weight:700; white-space:nowrap;}
  .navlink{display:flex; align-items:center; gap:.65rem; padding:.7rem .9rem; border-radius:10px; color:var(--ink-soft); font-weight:700; font-size:.9rem; cursor:pointer; min-height:44px;}
  .navlink:hover{background:var(--surface-2); color:var(--ink);}
  .navlink.active{background:var(--brand); color:#fff; box-shadow:0 6px 16px -6px color-mix(in srgb, var(--brand) 70%, transparent);}
  .scrollx{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  table{border-collapse:collapse; width:100%;}
  th{font-size:.76rem; color:var(--ink-soft); font-weight:700; text-align:right; padding:.6rem .8rem; border-bottom:1px solid var(--line); white-space:nowrap;}
  td{padding:.65rem .8rem; border-bottom:1px solid var(--line); font-size:.87rem; vertical-align:middle;}
  tr:hover td{background:var(--surface-2);}
  table.rtable tr.rt-row{cursor:pointer;}
  .rt-emp{display:flex; align-items:center; gap:.55rem; white-space:nowrap;}
  /* Compact real table on phones: keep it a genuine table (like a normal list),
     just hide the secondary columns instead of stacking every field into a tall card. */
  @media (max-width: 640px){
    table.rtable th, table.rtable td{ padding:.55rem .5rem; font-size:.82rem; }
    table.rtable .hide-sm{ display:none; }
    table.rtable .rt-emp{ gap:.4rem; }
  }
  .modal-backdrop{position:fixed; inset:0; background:rgba(10,20,17,.5); backdrop-filter:blur(2px); z-index:50; display:flex; align-items:center; justify-content:center; padding:1rem;}
  .avatar{width:44px; height:44px; border-radius:50%; object-fit:cover; background:var(--surface-2); border:1px solid var(--line);}
  .spin{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .fade-in{animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
  ::-webkit-scrollbar{height:8px; width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px;}
  .stat-num{font-family:'Cairo',sans-serif; font-weight:800; font-size:1.7rem;}
  .stat-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:.75rem; }
  @media (min-width:640px){ .stat-grid{ grid-template-columns:repeat(3,1fr); gap:.9rem; } }
  @media (min-width:1024px){ .stat-grid{ grid-template-columns:repeat(5,1fr); } }
  .filters-grid{ display:grid; grid-template-columns:1fr 1fr; gap:.75rem; }
  @media (min-width:640px){ .filters-grid{ grid-template-columns:repeat(3,1fr); } }
  @media (min-width:1024px){ .filters-grid{ grid-template-columns:repeat(5,1fr); } }
  .cards-grid{ display:grid; grid-template-columns:1fr; gap:1rem; }
  @media (min-width:640px){ .cards-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (min-width:1280px){ .cards-grid{ grid-template-columns:repeat(3,1fr); } }
  .err-box{background:var(--red-tint); color:var(--red); border-radius:10px; padding:.6rem .8rem; font-size:.8rem; display:flex; align-items:center; gap:.5rem;}

  /* ===================== App shell — dedicated professional dark theme =====================
     Applied post-login regardless of OS light/dark setting, so the dashboard always looks like
     the branded product rather than following the visitor's system preference. Because every
     existing rule already reads colors from CSS custom properties (var(--bg), var(--surface)…),
     redefining those properties on .app-shell cascades to every component underneath for free. */
  #app .app-shell{
    --ink:#F3F8F6; --ink-soft:#96AAA2; --line:#223530;

<script type="module">
/* ============================= FIREBASE ============================= */

const $ = sel => document.querySelector(sel);
const el = (tag, cls, html) => { const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; };
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDT = iso => { if(!iso) return '—'; try{ return new Intl.DateTimeFormat('ar', {calendar:'gregory', day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}).format(new Date(iso)); }catch(e){ return iso; } };
const fmtD = iso => { if(!iso) return '—'; try{ return new Intl.DateTimeFormat('ar', {calendar:'gregory', day:'2-digit', month:'2-digit', year:'numeric'}).format(new Date(iso)); }catch(e){ return iso; } };

  const map = {

/* ============================= SESSION TIMEOUT (20 min inactivity) =============================
   Firebase Auth otherwise keeps a device signed in indefinitely. This layer forces a fresh
   login after 20 minutes with no real user interaction (click/tap/keypress), on this device. */
const SESSION_MAX_AGE_MS = 20 * 60 * 1000;
const SESSION_KEY = 'masar_last_activity';
let sessionInterval = null;
let sessionListenersAttached = false;
function touchSession(){ try{ localStorage.setItem(SESSION_KEY, String(Date.now())); }catch(e){} }
function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }
function isSessionExpired(){
  let last = 0;
  try{ last = Number(localStorage.getItem(SESSION_KEY) || 0); }catch(e){}
  // لا يوجد سجل نشاط سابق = جلسة دخول جديدة فعلاً (وليست جلسة قديمة عائدة) -> غير منتهية
  if(!last) return false;
  return (Date.now() - last) > SESSION_MAX_AGE_MS;
}
function onUserActivity(){ if(auth.currentUser) touchSession(); }
function startSessionWatch(){
  if(!sessionListenersAttached){
    ['click','keydown','touchstart'].forEach(evt => document.addEventListener(evt, onUserActivity, {passive:true}));
    sessionListenersAttached = true;
  }
  if(sessionInterval) clearInterval(sessionInterval);
  sessionInterval = setInterval(()=>{
    if(isSessionExpired()){
      stopSessionWatch();
      clearSession();
      toast('تم تسجيل الخروج تلقائياً لعدم النشاط لمدة 20 دقيقة','error');
      signOut(auth);

  }, 15000);
}
function stopSessionWatch(){
  if(sessionInterval){ clearInterval(sessionInterval); sessionInterval = null; }
}

    const uSnap = await getDoc(doc(db,'users',user.uid));
    if(uSnap.exists()){
      S.me.name = uSnap.data().name || user.displayName || '';

/* ---- Photo handling: resize + compress locally in the browser, store as a
   data URL directly inside the Firestore document. No Firebase Storage
   involved at all, so it stays fully free on the Spark plan. ---- */
function resizeImageToDataURL(file, maxDim=320, quality=0.72){
  return new Promise((resolve, reject)=>{
    if(!file.type || !file.type.startsWith('image/')){ reject(new Error('not-image')); return; }
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('read-failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('decode-failed'));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w >= h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else{ if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        try{
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          if(dataUrl.length > 700000){ reject(new Error('too-large')); return; }
          resolve(dataUrl);
        }catch(e){ reject(e); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function photoErrorMessage(err){
  const code = err && err.message;
  if(code === 'not-image') return 'الملف المختار ليس صورة.';
  if(code === 'too-large') return 'الصورة كبيرة جداً حتى بعد الضغط — جرّب صورة أخرى.';
  return 'تعذّرت معالجة الصورة — جرّب صورة أخرى.';
}

      ...emailProgress(status, m.color), subject:`مسار — ${m.subject}`, status_title:m.title, extra_block:m.block || '', header_color:m.color, step_label:m.step, employee_name:r.employeeNameAr || '', company_name:r.companyName || '—', request_date:fmtMailDate(r.createdAt), next_step:m.next || '', status_pill:m.pill || m.title
    });
    toast(ok ? 'تم إرسال إيميل للموظف' : 'تعذّر إرسال الإيميل للموظف', ok ? undefined : 'error');
  }catch(e){ console.error('employee email fail', e); toast('تعذّر إرسال الإيميل للموظف','error'); }
}
async function sendEmailTo(to, requestNumber, message, extra){
  if(!EMAILJS.serviceId || !EMAILJS.templateId || !EMAILJS.publicKey) return false;
  try{
    const res = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        service_id: EMAILJS.serviceId, template_id: EMAILJS.templateId, user_id: EMAILJS.publicKey,
        template_params: Object.assign({
          to_email: to, app_name: 'مسار',
          subject: requestNumber ? `مسار — طلب فحص رقم ${requestNumber}` : 'مسار — إشعار جديد',
          message, request_number: requestNumber || '',
          status_title:'إشعار جديد', extra_block:'', header_color:'#0E6B5C', step_label:'', employee_name:'', company_name:'', request_date:'', next_step:'', status_pill:'إشعار', s1:'#DCE5E0', s2:'#DCE5E0', s3:'#DCE5E0', s4:'#DCE5E0'
        }, extra||{})
      })
    });
    if(!res.ok) console.error('email fail', res.status, await res.text());
    return res.ok;
  }catch(e){ console.error('email fail', e); return false; }
}
async function sendEmailNotification(toRole, requestNumber, message){
  try{
    const list = (EMAILJS.recipients[toRole] || []).filter(Boolean);
    await Promise.all(list.map(to => sendEmailTo(to, requestNumber, message)));
  }catch(e){ console.error('email fail', e); }
}
async function notify({toRole, toUserId, requestId, requestNumber, message}){
  sendEmailNotification(toRole || 'hr', requestNumber, message);
  try{ await addDoc(collection(db,'notifications'), { toRole:toRole||null, toUserId:toUserId||null, requestId, requestNumber, message, createdAt:nowISO(), read:false }); }
  catch(e){ console.error('notify fail', e); }
}

/* ---------------- HR: Import requests from any Excel file ---------------- */
function normalizeHeader(h){
  return String(h||'').trim().toLowerCase()
    .replace(/[\u064B-\u0652]/g,'')
    .replace(/[إأآا]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')
    .replace(/[_\-\/]/g,' ')
    .replace(/\s+/g,' ').trim();
}
const IMPORT_FIELD_LABELS = { employeeNameAr:'اسم الموظف', employeePhone:'رقم الجوال', employeeEmail:'الإيميل', employeeNameEn:'الاسم بالإنجليزي', idNumber:'رقم الهوية', companyName:'الشركة', billingCompany:'جهة الفاتورة', examType:'نوع الفحص', notes:'ملاحظات' };
const IMPORT_FIELD_SYNONYMS = {
  employeeNameAr: ['اسم الموظف','الموظف','اسم الموظف بالعربي','اسم الموظف عربي','الاسم','اسم','name','employee','employee name','full name'],
  employeeEmail: ['الايميل','الإيميل','ايميل','إيميل','البريد','البريد الالكتروني','البريد الإلكتروني','email','e-mail','mail'],
  employeePhone: ['رقم الجوال','الجوال','جوال','رقم الموظف','رقم الهاتف','الهاتف','هاتف','رقم الموبايل','موبايل','واتساب','واتس اب','رقم الواتساب','mobile','mobile number','phone','phone number','whatsapp','tel'],
  employeeNameEn: ['الاسم بالانجليزي','اسم الموظف بالانجليزي','اسم انجليزي','name en','english name','employee name en'],
  idNumber: ['رقم الهويه','الهويه','هويه','رقم الاقامه','الاقامه','اقامه','رقم الهويه الاقامه','id','id number','iqama','national id','identity number'],
  companyName: ['الشركه','شركه','اسم الشركه','جهه العمل','company','company name','employer'],
  billingCompany: ['الفاتوره','فاتوره باسم','تصدر الفاتوره','الشركه الفاتوره','فاتوره تحت مسمى','تحت مسمى','billing','billing company','invoice company'],
  examType: ['نوع الفحص','الفحص','نوع الكشف','exam type','exam'],
  notes: ['ملاحظات','ملاحظه','notes','note'],
};
function matchColumn(headers, field, used=[]){
  const syns = IMPORT_FIELD_SYNONYMS[field];
  const normHeaders = headers.filter(h=>!used.includes(h)).map(h=>({orig:h, norm:normalizeHeader(h)})).filter(h=>h.norm);
  for(const s of syns){ const sn = normalizeHeader(s); const hit = normHeaders.find(h=>h.norm===sn); if(hit) return hit.orig; }
  for(const s of syns){ const sn = normalizeHeader(s); const hit = normHeaders.find(h=>h.norm.includes(sn) || sn.includes(h.norm)); if(hit) return hit.orig; }
  return null;
}
function openImportModal(){
  if(typeof XLSX === 'undefined'){ toast('تعذّر تحميل مكتبة قراءة الإكسل — تحقق من الاتصال بالإنترنت','error'); return; }
  const wrap = el('div','modal-backdrop');
  wrap.innerHTML = `
    <div class="card p-5 w-full max-w-lg fade-in" style="max-height:90vh;overflow:auto">
      <h3 class="font-bold mb-2">استيراد طلبات من ملف إكسل</h3>
      <p class="text-xs mb-4" style="color:var(--ink-soft)">اختر أي ملف إكسل (xlsx أو xls أو csv) بأي ترتيب أعمدة — سيتعرّف النظام تلقائياً على أعمدة اسم الموظف، رقم الهوية، الشركة، وجهة الفاتورة من عناوين الأعمدة، ويتجاهل أي أعمدة أخرى غير معروفة.</p>
      <input type="file" id="importFile" accept=".xlsx,.xls,.csv">
      <div id="importStatus" class="text-sm mt-3" style="color:var(--ink-soft)"></div>
      <div id="importPreviewWrap"></div>
      <div class="flex gap-2 mt-4">
        <button id="importConfirmBtn" class="btn btn-brand px-5 py-2.5 text-sm flex-1 hidden">تأكيد الاستيراد</button>
        <button id="importCancelBtn" class="btn btn-ghost px-5 py-2.5 text-sm">إلغاء</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  wrap.onclick = (e)=>{ if(e.target===wrap) wrap.remove(); };
  wrap.querySelector('#importCancelBtn').onclick = ()=>wrap.remove();

  let parsedRows = [];

  wrap.querySelector('#importFile').addEventListener('change', (e)=>{
    const f = e.target.files[0]; if(!f) return;
    const statusEl = wrap.querySelector('#importStatus');
    const previewEl = wrap.querySelector('#importPreviewWrap');
    const confirmBtn = wrap.querySelector('#importConfirmBtn');
    statusEl.textContent = 'جارِ قراءة الملف…';
    confirmBtn.classList.add('hidden');
    previewEl.innerHTML = '';
    const reader = new FileReader();
    reader.onerror = ()=>{ statusEl.innerHTML = `<span style="color:var(--red)">تعذّر قراءة الملف</span>`; };
    reader.onload = (ev)=>{
      try{
        const wb = XLSX.read(ev.target.result, {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
        if(!rows.length){ statusEl.innerHTML = `<span style="color:var(--red)">الملف فارغ أو بدون بيانات قابلة للقراءة</span>`; return; }
        const headers = Object.keys(rows[0]);
        const mapping = {};
        const usedCols = [];
        ['employeeEmail','employeePhone', ...Object.keys(IMPORT_FIELD_LABELS).filter(k=>k!=='employeePhone'&&k!=='employeeEmail')].forEach(f=>{
          mapping[f] = matchColumn(headers, f, usedCols);
          if(mapping[f]) usedCols.push(mapping[f]);
        });

        parsedRows = [];
        let skipped = 0;
        rows.forEach(row=>{
          const get = f => mapping[f] ? String(row[mapping[f]] ?? '').trim() : '';
          const employeeNameAr = get('employeeNameAr');
          const idNumber = get('idNumber');
          if(!employeeNameAr || !idNumber){ skipped++; return; }
          const companyName = get('companyName') || '—';
          parsedRows.push({
            employeeNameAr, employeeNameEn: get('employeeNameEn'), idNumber, employeePhone: get('employeePhone'), employeeEmail: get('employeeEmail'),
            companyName,
            billingCompany: get('billingCompany') || companyName,
            examType: get('examType'), notes: get('notes'),
          });
        });

        const mappingLines = Object.entries(mapping).map(([f,h])=>
          `<div class="flex items-center justify-between text-xs" style="padding:.2rem 0;"><span style="color:var(--ink-soft)">${IMPORT_FIELD_LABELS[f]}</span><span class="font-bold" style="color:${h?'var(--brand)':'var(--ink-soft)'}">${h? esc(h) : '— لم يُكتشف —'}</span></div>`
        ).join('');

        statusEl.innerHTML = `تم العثور على <b>${rows.length}</b> صف — سيتم استيراد <b style="color:var(--brand)">${parsedRows.length}</b> طلب${skipped? `، وتجاهل <b style="color:var(--red)">${skipped}</b> صف لنقص اسم الموظف أو رقم الهوية.` : '.'}`;
        previewEl.innerHTML = `
          <div class="card p-3 mt-3" style="background:var(--surface-2)">
            <div class="text-xs font-bold mb-2">الأعمدة المكتشفة تلقائياً:</div>
            ${mappingLines}
          </div>
          ${parsedRows.length? `<div class="scrollx mt-3"><table class="rtable"><thead><tr><th>الموظف</th><th>الهوية</th><th>الشركة</th></tr></thead><tbody>
            ${parsedRows.slice(0,5).map(r=>`<tr><td>${esc(r.employeeNameAr)}</td><td>${esc(r.idNumber)}</td><td>${esc(r.companyName)}</td></tr>`).join('')}
          </tbody></table></div>${parsedRows.length>5? `<div class="text-xs mt-1" style="color:var(--ink-soft)">و${parsedRows.length-5} صف آخر…</div>`:''}` : ''}
        `;
        if(parsedRows.length) confirmBtn.classList.remove('hidden');
      }catch(err){
        console.error(err);
        statusEl.innerHTML = `<span style="color:var(--red)">تعذّر قراءة الملف — تأكد أنه ملف إكسل أو CSV صالح</span>`;
      }
    };
    reader.readAsArrayBuffer(f);
  });

  wrap.querySelector('#importConfirmBtn').onclick = async ()=>{
    if(!parsedRows.length) return;
    const confirmBtn = wrap.querySelector('#importConfirmBtn');
    const statusEl = wrap.querySelector('#importStatus');
    confirmBtn.disabled = true; confirmBtn.textContent = 'جارِ الاستيراد…';
    let done = 0;
    for(const row of parsedRows){
      try{
        const reqNumber = genReqNumber();
        const docData = {
          requestNumber: reqNumber,
          employeeNameAr: row.employeeNameAr, employeeNameEn: row.employeeNameEn || '',
          idNumber: row.idNumber, employeePhone: row.employeePhone || '', employeeEmail: row.employeeEmail || '', photoURL: null,
          companyName: row.companyName, billingCompany: row.billingCompany,
          examType: row.examType || '', notes: row.notes || '',
          status: 'sent', rejectionReason: '',
          createdAt: nowISO(), createdBy: S.me.uid, createdByName: S.me.name || '',
          updatedAt: nowISO(),
        };
        const refDoc = await addDoc(collection(db,'requests'), docData);
        await Promise.all([
          maybeAddLookup('companies', docData.companyName),
          maybeAddLookup('companies', docData.billingCompany),
        ]);
        await addLog(refDoc.id, reqNumber, 'تم استيراد الطلب من ملف إكسل', `بواسطة ${S.me.name || ''}`);
      }catch(err){ console.error('import row failed', err); }
      done++;
      statusEl.textContent = `جارِ الاستيراد… ${done} / ${parsedRows.length}`;
    }
    try{ await notify({ toRole:'reception', requestId:null, requestNumber:null, message:`تم استيراد ${done} طلب فحص جديد من ملف إكسل` }); }catch(e){}
    toast(`تم استيراد ${done} طلب بنجاح`);
    wrap.remove();
  };
}

    ? `<div class="grid cards-grid">${items.map(r=>requestCard(r)).join('')}</div>`

  wireCardEvents();
}
function requestCard(r){
  const st = STATUS[r.status] || STATUS.sent;
  const photo = r.photoURL ? `<img src="${r.photoURL}" class="avatar">` : `<div class="avatar flex items-center justify-center" style="color:var(--ink-soft)">${iconUser}</div>`;
  return `
  <div class="card p-4 fade-in${normStatus(r.status)==='completed'?' done':''}">
    <div class="flex items-start gap-3 mb-3">
      ${photo}
      <div class="min-w-0 flex-1">

      </div>
      <div class="flex flex-col items-end gap-1">

    <div class="grid grid-cols-2 gap-y-1.5 text-xs mb-3">
      <div class="col-span-2"><span style="color:var(--ink-soft)">الشركة: </span>${esc(r.companyName)}</div>
      <div class="col-span-2"><span style="color:var(--ink-soft)">فاتورة باسم: </span>${esc(r.billingCompany)}</div>

    </div>
    ${reqActionsHTML(r,'px-3 py-1.5 text-xs flex-1') ? `<div class="flex flex-wrap gap-2">${reqActionsHTML(r,'px-3 py-1.5 text-xs flex-1')}</div>` : ''}
  </div>`;
}
/* أزرار الانتقال بين المراحل (للاستقبال): زيارة المركز ← تم الفحص ← اجتياز التثقيف ← تم */
function reqActionsHTML(r, cls){
  const b = (action, label, kind)=>`<button class="btn ${kind||'btn-brand'} ${cls}" data-action="${action}" data-id="${r.id}">${label}</button>`;
  if(r.status==='sent') return b('examine','تم الفحص') + b('reject','رفض الطلب','btn-danger');
  if(r.status==='examined') return b('education','بانتظار اجتياز التثقيف');
  if(r.status==='education') return b('complete','تم اجتياز التثقيف');
  return '';
}
function wireStatusActions(root, inModal){
  const T = (sel, status, at, by, nm, msg)=> root.querySelectorAll(`[data-action="${sel}"]`).forEach(b=>b.onclick=()=>doTransition(b.dataset.id,status,at,by,nm,msg));
  T('examine','examined','examinedAt','examinedBy','examinedByName','تم الفحص');
  T('education','education','educationAt','educationBy','educationByName','بانتظار اجتياز التثقيف');
  T('complete','completed','completedAt','completedBy','completedByName','تم إكمال الطلب');
  root.querySelectorAll('[data-action="reject"]').forEach(b=>b.onclick=()=>{ if(inModal) closeModal(); openRejectModal(b.dataset.id); });
}
function wireCardEvents(){ wireStatusActions(document, false); }
async function doTransition(id, status, atField, byField, nameField, msg){
  const r = S.requests.find(x=>x.id===id); if(!r) return;
  try{
    await updateDoc(doc(db,'requests',id), { status, [atField]:nowISO(), [byField]:S.me.uid, [nameField]:S.me.name||'', updatedAt:nowISO() });
    await addLog(id, r.requestNumber, msg, '');
    const label = (STATUS[status] && STATUS[status].label) || status;
    await notify({ toUserId:r.createdBy, requestId:id, requestNumber:r.requestNumber,
      message: status==='completed' ? `اكتمل طلب الفحص رقم ${r.requestNumber} — ${r.employeeNameAr}` : `تحديث حالة طلب الفحص رقم ${r.requestNumber} — ${r.employeeNameAr}: ${label}` });
    emailEmployee(r, status);
    toast(msg); closeModal();
  }catch(e){ console.error(e); toast('تعذّر تنفيذ العملية','error'); }
}
function openRejectModal(id){
  const r = S.requests.find(x=>x.id===id); if(!r) return;
  const wrap = el('div','modal-backdrop');
  wrap.innerHTML = `
    <div class="card p-5 w-full max-w-sm fade-in">
      <h3 class="font-bold mb-1">رفض الطلب</h3>
      <p class="text-xs mb-3" style="color:var(--ink-soft)">طلب رقم ${esc(r.requestNumber)} — ${esc(r.employeeNameAr)}</p>
      <label class="field-label">سبب الرفض *</label>
      <textarea id="rejectReason" rows="3" placeholder="اكتب سبب الرفض هنا"></textarea>
      <div class="flex gap-2 mt-4">
        <button id="rejectConfirm" class="btn btn-danger px-4 py-2 text-sm flex-1">تأكيد الرفض</button>
        <button id="rejectCancel" class="btn btn-ghost px-4 py-2 text-sm">إلغاء</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  wrap.querySelector('#rejectCancel').onclick = ()=>wrap.remove();
  wrap.onclick = (e)=>{ if(e.target===wrap) wrap.remove(); };
  wrap.querySelector('#rejectConfirm').onclick = async ()=>{
    const reason = wrap.querySelector('#rejectReason').value.trim();
    if(!reason){ toast('الرجاء كتابة سبب الرفض','error'); return; }
    try{
      await updateDoc(doc(db,'requests',id), { status:'rejected', rejectionReason:reason, rejectedAt:nowISO(), rejectedBy:S.me.uid, rejectedByName:S.me.name||'', updatedAt:nowISO() });
      await addLog(id, r.requestNumber, 'تم رفض الطلب', reason);
      await notify({ toUserId:r.createdBy, requestId:id, requestNumber:r.requestNumber, message:`تم رفض طلب الفحص رقم ${r.requestNumber} — السبب: ${reason}` });
      emailEmployee(r, 'rejected', reason);
      toast('تم رفض الطلب'); wrap.remove();
    }catch(e){ console.error(e); toast('تعذّر تنفيذ العملية','error'); }
  };
}

    const all = $('#selAllBtn'); if(all) all.onclick = ()=>{ S.logVisibleIds.forEach(id=>S.selectedIds.add(id)); renderLogTable(); };
    const none = $('#selNoneBtn'); if(none) none.onclick = ()=>{ S.selectedIds.clear(); renderLogTable(); };
    const del = $('#bulkDelBtn'); if(del) del.onclick = openBulkDeleteConfirm;
  }
  const apply = ()=>{
    S.filters = { q: $('#fq').value.trim(), status: $('#fstatus').value, company: $('#fcompany').value, from: $('#ffrom').value, to: $('#fto').value };

  };
  ['fq','fstatus','fcompany','ffrom','fto'].forEach(id=>{ $('#'+id).addEventListener('input', apply); $('#'+id).addEventListener('change', apply); });

}
function renderLogTable(){
  const wrap = $('#logTableWrap'); if(!wrap) return;
  const f = S.filters;
  let items = S.requests.slice();
  if(f.q){ const q = f.q.toLowerCase(); items = items.filter(r => [r.employeeNameAr,r.employeeNameEn,r.idNumber,r.requestNumber].some(v=> (v||'').toLowerCase().includes(q))); }
  if(f.status) items = items.filter(r=>r.status===f.status);
  if(f.company) items = items.filter(r=>r.companyName===f.company);
  if(f.from) items = items.filter(r=> r.createdAt && r.createdAt.slice(0,10) >= f.from);
  if(f.to) items = items.filter(r=> r.createdAt && r.createdAt.slice(0,10) <= f.to);
  S.logVisibleIds = items.map(r=>r.id);
  const existing = new Set(S.requests.map(r=>r.id));
  S.selectedIds.forEach(id=>{ if(!existing.has(id)) S.selectedIds.delete(id); });
  wrap.innerHTML = requestsTable(items, {selectable:true});
  wireRequestTableEvents();
  wireSelection();
  updateSelectionBar();
}
function wireSelection(){
  if(!(S.role==='hr' && S.selectMode)) return;
  document.querySelectorAll('tr[data-selrow]').forEach(tr=>{
    tr.onclick = ()=>{
      const id = tr.dataset.selrow;
      const on = !S.selectedIds.has(id);
      if(on) S.selectedIds.add(id); else S.selectedIds.delete(id);
      tr.classList.toggle('selected', on);
      const cb = tr.querySelector('input[data-sel]'); if(cb) cb.checked = on;
      updateSelectionBar();
    };
  });
  const head = $('#selAllHead');
  if(head) head.onchange = ()=>{
    if(head.checked) S.logVisibleIds.forEach(id=>S.selectedIds.add(id)); else S.logVisibleIds.forEach(id=>S.selectedIds.delete(id));
    renderLogTable();
  };
}
function updateSelectionBar(){
  if(!S.selectMode) return;
  const n = S.selectedIds.size;
  const c = $('#selCount'); if(c) c.textContent = n;
  const d = $('#bulkDelBtn'); if(d) d.disabled = n===0;
  const head = $('#selAllHead');
  if(head) head.checked = S.logVisibleIds.length>0 && S.logVisibleIds.every(id=>S.selectedIds.has(id));
}
function openBulkDeleteConfirm(){

    const st = wrap.querySelector('#bulkDelStatus');
    let done = 0, failed = 0; const deletedNums = [];
    for(const r of reqs){
      try{ await deleteDoc(doc(db,'requests',r.id)); done++; deletedNums.push(r.requestNumber); S.selectedIds.delete(r.id); }
      catch(e){ console.error('bulk delete failed for', r.id, e); failed++; }
      st.textContent = `جارِ الحذف… ${done+failed} / ${reqs.length}`;
    }
    if(done){ try{ await addLog(null, null, `تم حذف ${done} طلب (حذف جماعي)`, deletedNums.join('، ')); }catch(e){ console.warn('bulk delete log failed', e); } }

/* ---------------- Completed requests (grouped by month) ---------------- */
function renderCompleted(){
  const body = $('#pageBody'); if(!body) return;
  const completed = S.requests.filter(r=>r.status==='completed');

  // Group by year-month of the request's creation date (e.g. "2026-09")
  const groups = {};
  completed.forEach(r=>{
    if(!r.createdAt) return;
    const key = r.createdAt.slice(0,7);
    (groups[key] = groups[key] || []).push(r);
  });
  const monthKeys = Object.keys(groups).sort((a,b)=> b.localeCompare(a));

  if(!monthKeys.length){
    body.innerHTML = `<div class="card overflow-hidden">${emptyState('لا توجد طلبات مكتملة بعد', 'ستظهر هنا الطلبات المكتملة مجمّعة حسب شهر تقديمها.')}</div>`;
    return;
  }
  if(!S.completedMonth || !groups[S.completedMonth]) S.completedMonth = monthKeys[0];

  const monthLabel = key=>{
    const [y,m] = key.split('-').map(Number);
    return new Intl.DateTimeFormat('ar', {calendar:'gregory', month:'long', year:'numeric'}).format(new Date(y, m-1, 1));
  };

  body.innerHTML = `
    <div class="flex flex-wrap gap-2 mb-5">
      ${monthKeys.map(k=>`<button class="btn ${k===S.completedMonth?'btn-brand':'btn-ghost'} px-4 py-2 text-sm" data-month="${k}" style="border-radius:999px;">
        ${esc(monthLabel(k))} <span style="opacity:.85">(${groups[k].length})</span>
      </button>`).join('')}
    </div>
    <div class="card overflow-hidden">${requestsTable(groups[S.completedMonth].slice().sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||'')))}</div>`;

  document.querySelectorAll('[data-month]').forEach(btn=>{
    btn.onclick = ()=>{ S.completedMonth = btn.dataset.month; renderCompleted(); };
  });
  wireRequestTableEvents();
}

function wireRequestTableEvents(){
  document.querySelectorAll('[data-openreq]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); openDetailModal(el.dataset.openreq); };

  examined:  { to:'education', at:'educationAt', by:'educationBy', nm:'educationByName', msg:'بانتظار اجتياز التثقيف' },

function advanceRequest(id){
  const r = S.requests.find(x=>x.id===id); if(!r) return;

  doTransition(id, n.to, n.at, n.by, n.nm, n.msg);

/* ---------------- HR: WhatsApp message to employee ---------------- */
function normalizePhone(p){
  let d = String(p||'')
    .replace(/[٠-٩]/g, c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c))
    .replace(/[۰-۹]/g, c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c))
    .replace(/\D/g,'');
  if(!d) return '';
  if(d.startsWith('00')) d = d.slice(2);
  if(d.startsWith('966')){ if(d.startsWith('9660')) d = '966'+d.slice(4); return d; }
  if(d.length===10 && d.startsWith('05')) return '966'+d.slice(1);
  if(d.length===9 && d.startsWith('5')) return '966'+d;
  return d; // رقم بمفتاح دولة آخر يُترك كما أُدخل
}
function buildWaMessage(r){

في حال عدم الالتزام، سيتحمل الموظف مسؤولية أي مخالفات تصدر من البلدية نتيجة لذلك.
شاكرين تعاونكم.

Dear Employee,
This is Khalid Waleed Abdulmohsen Al-Quraini from the HR Department.
Please visit the health center for the medical examination required to issue your Municipality Health Card, and bring a personal photo (4×6 cm).
Failure to comply will make you responsible for any resulting municipal fines.

🕘 مواعيد المستشفى (جدة):
9:00 ص – 3:00 م
🕘 Hospital Hours (Jeddah):
9:00 AM – 3:00 PM

https://maps.app.goo.gl/sU2WdQ8KntPsuvMfA
Thank you for your cooperation.`;
}

          <div><label class="field-label">رقم الهوية / الإقامة *</label><input required name="idNumber" value="${esc(r.idNumber)}"></div>
          <div><label class="field-label">نوع الفحص الطبي</label><input name="examType" value="${esc(r.examType||'')}"></div>
        </div>
        <div><label class="field-label">رقم جوال الموظف (واتساب)</label><input name="employeePhone" inputmode="tel" dir="ltr" style="text-align:right" placeholder="05XXXXXXXX" value="${esc(r.employeePhone||'')}"></div>
        <div><label class="field-label">إيميل الموظف (اختياري — لإرسال التحديثات)</label><input name="employeeEmail" type="email" dir="ltr" style="text-align:right" placeholder="name@example.com" value="${esc(r.employeeEmail||'')}"></div>
        <div>
          <label class="field-label">اسم الشركة *</label><input required list="editCompaniesList" name="companyName" value="${esc(r.companyName)}"><datalist id="editCompaniesList"></datalist>
        </div>
        <div><label class="field-label">الشركة التي سيتم إصدار الفاتورة باسمها *</label><input required list="editBillingList" name="billingCompany" value="${esc(r.billingCompany)}"><datalist id="editBillingList"></datalist></div>
        <div>
          <label class="field-label">صورة الموظف</label>
          <div class="flex items-center gap-3">
            <div id="editPhotoPreviewWrap" class="avatar flex items-center justify-center overflow-hidden" style="width:64px;height:64px">${photo}</div>
            <label class="btn btn-ghost px-3 py-2 text-sm cursor-pointer">تغيير الصورة<input type="file" id="editPhotoInput" accept="image/*" class="hidden"></label>
            <span id="editPhotoStatus" class="text-xs" style="color:var(--ink-soft)"></span>
          </div>
        </div>
        <div><label class="field-label">ملاحظات</label><textarea name="notes" rows="2">${esc(r.notes||'')}</textarea></div>
        <div class="grid md:grid-cols-2 gap-4 pt-2" style="border-top:1px solid var(--line)">
          <div>
            <label class="field-label">حالة الطلب</label>
            <select name="status">
              ${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${r.status===k?'selected':''}>${v.label}</option>`).join('')}
            </select>
          </div>
          <div><label class="field-label">سبب الرفض (إن وجد)</label><input name="rejectionReason" value="${esc(r.rejectionReason||'')}"></div>
        </div>
        <p class="text-xs" style="color:var(--ink-soft)">تعديل الحالة هنا يدوي وخارج سير العمل المعتاد بين HR والاستقبال — استخدمه فقط لتصحيح الأخطاء.</p>
        <div class="flex gap-2 pt-2">
          <button type="submit" id="editSaveBtn" class="btn btn-brand px-5 py-2.5 text-sm flex-1">حفظ التعديلات</button>
          <button type="button" id="editCancelBtn" class="btn btn-ghost px-5 py-2.5 text-sm">إلغاء</button>
        </div>
      </form>
    </div>`;
  document.body.appendChild(wrap);
  wrap.onclick = (e)=>{ if(e.target===wrap) wrap.remove(); };
  wrap.querySelector('#editCancelBtn').onclick = ()=>wrap.remove();
  wrap.querySelector('#editCompaniesList').innerHTML = S.companies.map(x=>`<option value="${esc(x)}">`).join('');
  wrap.querySelector('#editBillingList').innerHTML = S.companies.map(x=>`<option value="${esc(x)}">`).join('');

  wrap.querySelector('#editPhotoInput').addEventListener('change', (e)=>{
    const f = e.target.files[0]; if(!f) return;
    const statusEl = wrap.querySelector('#editPhotoStatus');
    const saveBtn = wrap.querySelector('#editSaveBtn');
    statusEl.textContent = 'جارِ معالجة الصورة…'; saveBtn.disabled = true;
    S.editPhotoUploadPromise = (async ()=>{
      try{
        const url = await resizeImageToDataURL(f);
        S.editPendingPhotoURL = url;
        wrap.querySelector('#editPhotoPreviewWrap').innerHTML = `<img src="${url}" class="avatar" style="width:64px;height:64px">`;
        statusEl.textContent = 'تم تجهيز الصورة ✓';
        return url;
      }catch(err){ console.error(err); statusEl.textContent='تعذّر معالجة الصورة'; toast(photoErrorMessage(err),'error'); throw err; }
      finally{ saveBtn.disabled = false; }
    })();
  });

  wrap.querySelector('#editForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = Object.fromEntries(fd.entries());
    if(!data.employeeNameAr || !data.idNumber || !data.companyName || !data.billingCompany){
      toast('الرجاء تعبئة الحقول المطلوبة (*)','error'); return;
    }
    const saveBtn = wrap.querySelector('#editSaveBtn');
    if(S.editPhotoUploadPromise){
      saveBtn.disabled = true; saveBtn.textContent = 'جارِ تجهيز الصورة…';
      try{ await S.editPhotoUploadPromise; }
      catch(err){ saveBtn.disabled=false; saveBtn.textContent='حفظ التعديلات'; toast('تعذّر تجهيز الصورة، أعد المحاولة قبل الحفظ','error'); return; }
    }
    saveBtn.disabled = true; saveBtn.textContent = 'جارِ الحفظ…';
    try{
      const updates = {
        requestType: data.requestType === 'renewal' ? 'renewal' : 'new',
        employeeNameAr: data.employeeNameAr.trim(),
        employeeNameEn: (data.employeeNameEn||'').trim(),
        idNumber: data.idNumber.trim(),
        employeePhone: (data.employeePhone||'').trim(),
        employeeEmail: (data.employeeEmail||'').trim(),
        companyName: data.companyName.trim(),
        billingCompany: data.billingCompany.trim(),
        examType: (data.examType||'').trim(),
        notes: (data.notes||'').trim(),
        status: data.status,
        rejectionReason: (data.rejectionReason||'').trim(),
        photoURL: S.editPendingPhotoURL,
        updatedAt: nowISO(),
      };
      const prevStatus = normStatus(r.status);
      await updateDoc(doc(db,'requests',id), updates);
      if(updates.status && updates.status !== prevStatus){
        emailEmployee({ ...r, ...updates }, updates.status, updates.status==='rejected' ? updates.rejectionReason : '');
      }
      await Promise.all([
        maybeAddLookup('companies', updates.companyName),
        maybeAddLookup('companies', updates.billingCompany),
        ]);
      await addLog(id, r.requestNumber, 'تم تعديل بيانات الطلب بواسطة HR', `بواسطة ${S.me.name||''}`);
      toast('تم حفظ التعديلات'); wrap.remove();
    }catch(err){ console.error(err); toast('تعذّر حفظ التعديلات','error'); saveBtn.disabled=false; saveBtn.textContent='حفظ التعديلات'; }
  });
}
