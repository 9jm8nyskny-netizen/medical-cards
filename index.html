<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسار — إدارة طلبات الفحص الطبي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --ink:#16231F; --ink-soft:#4C5E58; --line:#DEE7E2;
    --bg:#F4F8F6; --surface:#FFFFFF; --surface-2:#EEF4F1;
    --brand:#0E6B5C; --brand-dark:#0A4E43; --brand-tint:#E3F2EE;
    --amber:#B9852B; --amber-tint:#FBF1DF;
    --blue:#3468A0; --blue-tint:#E7EFF7;
    --violet:#6B5AA6; --violet-tint:#EEEBF8;
    --green:#2D8A54; --green-tint:#E5F4EA;
    --red:#B8473B; --red-tint:#FBEAE8;
    --teal-solid:#0E6B5C;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#EAF1EE; --ink-soft:#A9BBB4; --line:#26332F;
      --bg:#101915; --surface:#16211C; --surface-2:#1C2823;
      --brand:#3FAE93; --brand-dark:#2C8A73; --brand-tint:#17332B;
      --amber:#D8A94E; --amber-tint:#2E2712;
      --blue:#79A6D6; --blue-tint:#16273A;
      --violet:#A996E0; --violet-tint:#251E3A;
      --green:#6FC495; --green-tint:#132A1D;
      --red:#E0847A; --red-tint:#331917;
      --teal-solid:#3FAE93;
    }
  }
  html,body{height:100%;}
  body{ background:var(--bg); color:var(--ink); font-family:'Tajawal',sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,.brandfont{font-family:'Cairo',sans-serif;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:14px;}
  .btn{border-radius:10px; font-weight:700; transition:transform .08s ease, opacity .15s ease; white-space:nowrap; display:inline-flex; align-items:center; justify-content:center; gap:0.4rem;}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.55; cursor:not-allowed;}
  .btn-brand{background:var(--brand); color:#fff;}
  .btn-brand:hover{background:var(--brand-dark);}
  .btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-danger{background:var(--red); color:#fff;}
  .btn-danger:hover{opacity:.9;}
  input,select,textarea{
    background:var(--surface); color:var(--ink); border:1px solid var(--line);
    border-radius:10px; padding:.65rem .8rem; width:100%; font-family:inherit; font-size:.92rem;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brand); outline-offset:1px; border-color:var(--brand);}
  label.field-label{font-size:.8rem; color:var(--ink-soft); font-weight:700; margin-bottom:.3rem; display:block;}
  .badge{display:inline-flex; align-items:center; gap:.35rem; padding:.28rem .7rem; border-radius:999px; font-size:.78rem; font-weight:700; white-space:nowrap;}
  .navlink{display:flex; align-items:center; gap:.65rem; padding:.65rem .9rem; border-radius:10px; color:var(--ink-soft); font-weight:700; font-size:.9rem; cursor:pointer;}
  .navlink:hover{background:var(--surface-2); color:var(--ink);}
  .navlink.active{background:var(--brand-tint); color:var(--brand-dark);}
  .scrollx{overflow-x:auto;}
  table{border-collapse:collapse; width:100%;}
  th{font-size:.76rem; color:var(--ink-soft); font-weight:700; text-align:right; padding:.65rem .8rem; border-bottom:1px solid var(--line); white-space:nowrap;}
  td{padding:.75rem .8rem; border-bottom:1px solid var(--line); font-size:.87rem; vertical-align:middle;}
  tr:hover td{background:var(--surface-2);}
  .modal-backdrop{position:fixed; inset:0; background:rgba(10,20,17,.5); backdrop-filter:blur(3px); z-index:100; display:flex; align-items:center; justify-content:center; padding:1rem;}
  .avatar{width:44px; height:44px; border-radius:50%; object-fit:cover; background:var(--surface-2); border:1px solid var(--line); shrink:0;}
  .spin{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .fade-in{animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
  ::-webkit-scrollbar{height:6px; width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px;}
  .stat-num{font-family:'Cairo',sans-serif; font-weight:800; font-size:1.7rem;}
  .err-box{background:var(--red-tint); color:var(--red); border-radius:10px; padding:.6rem .8rem; font-size:.8rem;}

  /* Mobile Bottom Navigation Bar Styles */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 64px;
    background: var(--surface);
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-around;
    z-index: 50;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .bottom-nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--ink-soft);
    width: 100%;
    height: 100%;
    cursor: pointer;
  }
  .bottom-nav-item.active {
    color: var(--brand);
  }
  .bottom-nav-item svg {
    width: 22px;
    height: 22px;
  }
</style>
</head>
<body class="pb-16 md:pb-0">

<div id="app" class="min-h-screen flex items-center justify-center">
  <div class="flex flex-col items-center gap-3" style="color:var(--ink-soft)">
    <svg class="spin" width="34" height="34" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="var(--brand)" stroke-width="3" stroke-linecap="round" stroke-dasharray="40" stroke-dashoffset="10"/></svg>
    <div class="text-sm">جارِ التحميل…</div>
  </div>
</div>

<script type="module">
/* ============================= FIREBASE ============================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
  signInWithEmailAndPassword, signOut, updateProfile
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, collection, doc, addDoc, setDoc, updateDoc, getDoc,
  onSnapshot, query, where, orderBy, limit
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import {
  getStorage, ref, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyD-4YAtzuOHW8PPCQX_FkniQovAAoNOesk",
  authDomain: "medical-cards-ccc2b.firebaseapp.com",
  projectId: "medical-cards-ccc2b",
  storageBucket: "medical-cards-ccc2b.firebasestorage.app",
  messagingSenderId: "490583563573",
  appId: "1:490583563573:web:fa4ab2b8ff2954d055007c",
  measurementId: "G-8V20CJTE6M"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const storage = getStorage(fbApp);

/* ============================= CONFIG ============================= */
const STATUS = {
  new:       { label: 'طلب جديد',              tint:'var(--amber-tint)', fg:'var(--amber)' },
  sent:      { label: 'بانتظار مراجعة المركز',   tint:'var(--blue-tint)',  fg:'var(--blue)'  },
  accepted:  { label: 'تم قبول الطلب',           tint:'var(--brand-tint)', fg:'var(--brand)' },
  rejected:  { label: 'تم رفض الطلب',            tint:'var(--red-tint)',   fg:'var(--red)'   },
  attended:  { label: 'حضر الموظف',              tint:'var(--violet-tint)',fg:'var(--violet)'},
  examined:  { label: 'تم الفحص',                tint:'var(--green-tint)', fg:'var(--green)' },
  completed: { label: 'مكتمل',                   tint:'var(--teal-solid)', fg:'#fff'         },
};
const ROLE_LABEL = { hr: 'مسؤول الموارد البشرية', reception: 'استقبال المركز الطبي' };

/* ============================= STATE ============================= */
const S = {
  me:{ uid:null, name:'', email:'' },
  role:null,
  requests:[], notifications:[], companies:[], sponsors:[],
  unsubs:[],
  tab:null,
  filters:{ q:'', status:'', company:'', sponsor:'', from:'', to:'' },
  notifOpen:false,
  pendingPhotoURL:null,
};

const $ = sel => document.querySelector(sel);
const el = (tag, cls, html) => { const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; };
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDT = iso => { if(!iso) return '—'; try{ return new Intl.DateTimeFormat('ar', {calendar:'gregory', day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}).format(new Date(iso)); }catch(e){ return iso; } };
const fmtD = iso => { if(!iso) return '—'; try{ return new Intl.DateTimeFormat('ar', {calendar:'gregory', day:'2-digit', month:'2-digit', year:'numeric'}).format(new Date(iso)); }catch(e){ return iso; } };
const nowISO = () => new Date().toISOString();
const genReqNumber = () => {
  const d = new Date(); const p = n => String(n).padStart(2,'0');
  const ymd = `${String(d.getFullYear()).slice(2)}${p(d.getMonth()+1)}${p(d.getDate())}`;
  return `MED-${ymd}-${Math.random().toString(36).slice(2,6).toUpperCase()}`;
};
function toast(msg, kind){
  const box = $('#toastbox') || (()=>{ const b=el('div',''); b.id='toastbox'; b.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;'; document.body.appendChild(b); return b; })();
  const t = el('div','fade-in', esc(msg));
  t.style.cssText = `background:${kind==='error'?'var(--red)':'var(--brand-dark)'};color:#fff;padding:.6rem 1.1rem;border-radius:10px;font-size:.85rem;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.18);text-align:center;`;
  box.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 2600);
}
function arError(code){
  const map = {
    'auth/invalid-email':'صيغة البريد الإلكتروني غير صحيحة',
    'auth/user-not-found':'لا يوجد حساب بهذا البريد',
    'auth/wrong-password':'كلمة المرور غير صحيحة',
    'auth/invalid-credential':'بيانات الدخول غير صحيحة',
    'auth/email-already-in-use':'هذا البريد مستخدم بالفعل',
    'auth/weak-password':'كلمة المرور ضعيفة (6 أحرف على الأقل)',
    'auth/too-many-requests':'محاولات كثيرة، حاول لاحقاً',
  };
  return map[code] || 'حدث خطأ، حاول مرة أخرى';
}

/* ============================= AUTH FLOW ============================= */
onAuthStateChanged(auth, async (user)=>{
  clearSubs();
  if(!user){ renderAuthScreen(); return; }
  S.me.uid = user.uid; S.me.email = user.email || '';
  try{
    const uSnap = await getDoc(doc(db,'users',user.uid));
    if(uSnap.exists()){
      S.me.name = uSnap.data().name || user.displayName || '';
      S.role = uSnap.data().role;
      startApp();
    } else {
      S.me.name = user.displayName || '';
      renderRolePicker();
    }
  }catch(e){
    console.error(e);
    renderAuthScreen('تعذّر الاتصال بقاعدة البيانات. تأكد من إعداد Firestore وقواعد الحماية.');
  }
});

function renderAuthScreen(errMsg){
  $('#app').innerHTML = `
  <div class="w-full min-h-screen flex items-center justify-center p-4">
    <div class="card p-6 md:p-8 max-w-md w-full fade-in">
      <div class="flex items-center gap-3 mb-1">
        <div style="width:40px;height:40px;border-radius:11px;background:var(--brand);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-family:'Cairo',sans-serif">م</div>
        <h1 class="text-xl font-bold brandfont">مسار</h1>
      </div>
      <p class="text-sm mb-6" style="color:var(--ink-soft)">إدارة طلبات الفحص الطبي للموظفين</p>

      <div class="flex gap-1 mb-5 p-1 rounded-xl" style="background:var(--surface-2)">
        <button id="tabLogin" class="flex-1 py-2 rounded-lg text-sm font-bold" style="background:var(--surface)">تسجيل الدخول</button>
        <button id="tabSignup" class="flex-1 py-2 rounded-lg text-sm font-bold" style="color:var(--ink-soft)">حساب جديد</button>
      </div>

      <div id="errSlot" class="mb-3">${errMsg? `<div class="err-box">${esc(errMsg)}</div>`:''}</div>

      <form id="loginForm" class="grid gap-3">
        <div><label class="field-label">البريد الإلكتروني</label><input required type="email" name="email"></div>
        <div><label class="field-label">كلمة المرور</label><input required type="password" name="password"></div>
        <button type="submit" id="loginBtn" class="btn btn-brand py-3 mt-1 w-full">دخول</button>
      </form>

      <form id="signupForm" class="grid gap-3 hidden">
        <div><label class="field-label">الاسم</label><input required name="name"></div>
        <div><label class="field-label">البريد الإلكتروني</label><input required type="email" name="email"></div>
        <div><label class="field-label">كلمة المرور</label><input required type="password" name="password" minlength="6"></div>
        <div>
          <label class="field-label">الصفة</label>
          <select name="role">
            <option value="hr">مسؤول الموارد البشرية</option>
            <option value="reception">موظف استقبال المركز الطبي</option>
          </select>
        </div>
        <button type="submit" id="signupBtn" class="btn btn-brand py-3 mt-1 w-full">إنشاء الحساب</button>
      </form>
    </div>
  </div>`;

  const showLogin = ()=>{
    $('#loginForm').classList.remove('hidden'); $('#signupForm').classList.add('hidden');
    $('#tabLogin').style.background='var(--surface)'; $('#tabLogin').style.color='var(--ink)';
    $('#tabSignup').style.background='transparent'; $('#tabSignup').style.color='var(--ink-soft)';
  };
  const showSignup = ()=>{
    $('#signupForm').classList.remove('hidden'); $('#loginForm').classList.add('hidden');
    $('#tabSignup').style.background='var(--surface)'; $('#tabSignup').style.color='var(--ink)';
    $('#tabLogin').style.background='transparent'; $('#tabLogin').style.color='var(--ink-soft)';
  };
  $('#tabLogin').onclick = showLogin;
  $('#tabSignup').onclick = showSignup;

  $('#loginForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const btn = $('#loginBtn'); btn.disabled = true; btn.textContent = 'جارِ الدخول…';
    try{
      await signInWithEmailAndPassword(auth, fd.get('email'), fd.get('password'));
    }catch(err){
      console.error(err);
      $('#errSlot').innerHTML = `<div class="err-box">${esc(arError(err.code))}</div>`;
    }finally{ btn.disabled=false; btn.textContent='دخول'; }
  });

  $('#signupForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const btn = $('#signupBtn'); btn.disabled = true; btn.textContent = 'جارِ الإنشاء…';
    try{
      const cred = await createUserWithEmailAndPassword(auth, fd.get('email'), fd.get('password'));
      await updateProfile(cred.user, { displayName: fd.get('name') });
      await setDoc(doc(db,'users',cred.user.uid), {
        name: fd.get('name'), email: fd.get('email'), role: fd.get('role'), createdAt: nowISO()
      });
    }catch(err){
      console.error(err);
      $('#errSlot').innerHTML = `<div class="err-box">${esc(arError(err.code))}</div>`;
    }finally{ btn.disabled=false; btn.textContent='إنشاء الحساب'; }
  });
}

function renderRolePicker(){
  $('#app').innerHTML = `
  <div class="w-full min-h-screen flex items-center justify-center p-4">
    <div class="card p-6 md:p-8 max-w-md w-full fade-in">
      <h1 class="text-xl font-bold brandfont mb-1">أكمل الإعداد</h1>
      <p class="text-sm mb-6" style="color:var(--ink-soft)">اختر صفتك في النظام</p>
      <div class="flex flex-col gap-3">
        <button id="pick-hr" class="btn p-4 text-right justify-start" style="border:1.5px solid var(--line);border-radius:12px;">
          <div class="font-bold mb-1">مسؤول الموارد البشرية</div>
        </button>
        <button id="pick-reception" class="btn p-4 text-right justify-start" style="border:1.5px solid var(--line);border-radius:12px;">
          <div class="font-bold mb-1">موظف استقبال المركز الطبي</div>
        </button>
      </div>
    </div>
  </div>`;
  $('#pick-hr').onclick = ()=>chooseRole('hr');
  $('#pick-reception').onclick = ()=>chooseRole('reception');
}
async function chooseRole(role){
  try{
    await setDoc(doc(db,'users',S.me.uid), { name:S.me.name||'', email:S.me.email||'', role, createdAt: nowISO() });
    S.role = role; startApp();
  }catch(e){ console.error(e); toast('تعذّر الحفظ، حاول مرة أخرى','error'); }
}

/* ============================= APP SHELL ============================= */
function clearSubs(){ S.unsubs.forEach(u=>{ try{u();}catch(e){} }); S.unsubs = []; }

function startApp(){
  S.tab = S.role==='hr' ? 'dashboard' : 'inbox';
  buildShell();
  subscribeAll();
}

function buildShell(){
  const isHR = S.role==='hr';
  const navItems = isHR ? [
    {id:'dashboard', label:'لوحة التحكم', icon:iconGrid},
    {id:'new', label:'طلب جديد', icon:iconPlus},
    {id:'log', label:'سجل الطلبات', icon:iconList},
  ] : [
    {id:'inbox', label:'الواردة', icon:iconInbox},
    {id:'log', label:'جميع الطلبات', icon:iconList},
  ];

  $('#app').innerHTML = `
  <div class="min-h-screen flex w-full">
    <!-- Desktop Sidebar -->
    <aside class="hidden md:flex flex-col shrink-0" style="width:236px;border-left:1px solid var(--line);background:var(--surface)">
      <div class="flex items-center gap-3 px-5 py-5">
        <div style="width:38px;height:38px;border-radius:10px;background:var(--brand);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-family:'Cairo',sans-serif">م</div>
        <div><div class="font-bold brandfont leading-none">مسار</div><div class="text-[11px]" style="color:var(--ink-soft)">إدارة الفحوصات الطبية</div></div>
      </div>
      <nav class="flex flex-col gap-1 px-3 mt-2">
        ${navItems.map(n=>`<div class="navlink" data-tab="${n.id}">${n.icon}<span>${n.label}</span></div>`).join('')}
      </nav>
      <div class="mt-auto px-3 pb-5">
        <div class="rounded-xl p-3 flex items-center gap-2" style="background:var(--surface-2)">
          <div class="avatar flex items-center justify-center font-bold" style="color:var(--brand)">${esc((S.me.name||'؟').slice(0,1))}</div>
          <div class="min-w-0">
            <div class="text-xs font-bold truncate">${esc(S.me.name||'مستخدم')}</div>
            <div class="text-[11px]" style="color:var(--ink-soft)">${esc(ROLE_LABEL[S.role])}</div>
          </div>
        </div>
        <button id="logoutBtn" class="text-[11px] mt-2 w-full text-center py-1.5" style="color:var(--ink-soft)">تسجيل الخروج</button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 min-w-0 flex flex-col min-h-screen">
      <header class="flex items-center justify-between gap-3 px-4 md:px-7 py-3" style="border-bottom:1px solid var(--line);background:var(--surface)">
        <div class="flex items-center gap-2 min-w-0">
          <div style="width:32px;height:32px;border-radius:8px;background:var(--brand);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-family:'Cairo',sans-serif" class="md:hidden">م</div>
          <h2 id="pageTitle" class="font-bold text-base md:text-lg truncate"></h2>
        </div>
        <div class="flex items-center gap-2">
          <div class="relative">
            <button id="notifBtn" class="btn-ghost btn p-2 relative">${iconBell}
              <span id="notifDot" class="hidden" style="position:absolute;top:-3px;left:-3px;background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 3px;"></span>
            </button>
            <div id="notifPanel" class="hidden" style="position:absolute;left:0;top:calc(100% + 8px);width:320px;max-width:88vw;max-height:70vh;overflow:auto;z-index:40;"></div>
          </div>
          <button id="logoutBtnMobile" class="md:hidden btn-ghost btn p-2" title="تسجيل الخروج">${iconLogout}</button>
        </div>
      </header>
      <main id="pageBody" class="flex-1 p-4 md:p-7 min-w-0 mb-16 md:mb-0"></main>
    </div>
  </div>

  <!-- Mobile Bottom Navigation -->
  <div class="bottom-nav md:hidden">
    ${navItems.map(n=>`
      <div class="bottom-nav-item" data-tab="${n.id}">
        ${n.icon}
        <span>${n.label}</span>
      </div>
    `).join('')}
  </div>`;

  document.querySelectorAll('[data-tab]').forEach(n=>n.onclick=()=> setTab(n.dataset.tab));
  $('#logoutBtn').onclick = ()=>signOut(auth);
  $('#logoutBtnMobile').onclick = ()=>signOut(auth);
  $('#notifBtn').onclick = toggleNotifPanel;
  setTab(S.tab);
}

function setTab(tab){
  S.tab = tab;
  document.querySelectorAll('[data-tab]').forEach(n=> n.classList.toggle('active', n.dataset.tab===tab));
  const titles = { dashboard:'لوحة التحكم', new:'طلب فحص جديد', log:'سجل الطلبات', inbox:'الطلبات الواردة' };
  $('#pageTitle').textContent = titles[tab] || '';
  renderTab();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

/* ============================= DATA SUBSCRIBE ============================= */
function subscribeAll(){
  const reqQ = query(collection(db,'requests'), orderBy('createdAt','desc'), limit(1000));
  S.unsubs.push(onSnapshot(reqQ, snap=>{
    S.requests = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    renderTab(); renderNotifPanel();
  }, e=>console.error('requests sub', e)));

  const notifQ = query(collection(db,'notifications'), orderBy('createdAt','desc'), limit(200));
  S.unsubs.push(onSnapshot(notifQ, snap=>{
    S.notifications = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    updateNotifDot(); renderNotifPanel();
  }, e=>console.error('notif sub', e)));

  const compQ = query(collection(db,'companies'), orderBy('name','asc'), limit(500));
  S.unsubs.push(onSnapshot(compQ, snap=>{
    S.companies = snap.docs.map(d=>d.data().name).filter(Boolean);
    refreshDatalists();
  }, e=>console.error('companies sub', e)));

  const spQ = query(collection(db,'sponsors'), orderBy('name','asc'), limit(500));
  S.unsubs.push(onSnapshot(spQ, snap=>{
    S.sponsors = snap.docs.map(d=>d.data().name).filter(Boolean);
    refreshDatalists();
  }, e=>console.error('sponsors sub', e)));
}
function refreshDatalists(){
  const c = $('#companiesList'); if(c) c.innerHTML = S.companies.map(x=>`<option value="${esc(x)}">`).join('');
  const b = $('#billingList'); if(b) b.innerHTML = S.companies.map(x=>`<option value="${esc(x)}">`).join('');
  const s = $('#sponsorsList'); if(s) s.innerHTML = S.sponsors.map(x=>`<option value="${esc(x)}">`).join('');
}
function myNotifications(){ return S.notifications.filter(n => n.toRole===S.role || n.toUserId===S.me.uid); }
function updateNotifDot(){
  const unread = myNotifications().filter(n=>!n.read).length;
  const dot = $('#notifDot'); if(!dot) return;
  if(unread>0){ dot.textContent = unread>9?'9+':unread; dot.classList.remove('hidden'); } else dot.classList.add('hidden');
}

/* ============================= NOTIFICATIONS PANEL ============================= */
function toggleNotifPanel(){
  S.notifOpen = !S.notifOpen;
  $('#notifPanel').classList.toggle('hidden', !S.notifOpen);
  renderNotifPanel();
  if(S.notifOpen) markVisibleNotifsRead();
}
function renderNotifPanel(){
  const p = $('#notifPanel'); if(!p || p.classList.contains('hidden')) return;
  const mine = myNotifications().slice(0,30);
  p.innerHTML = `
    <div class="card fade-in" style="box-shadow:0 12px 32px rgba(0,0,0,.14)">
      <div class="px-4 py-3 font-bold text-sm" style="border-bottom:1px solid var(--line)">الإشعارات</div>
      <div>
        ${mine.length? mine.map(n=>`
          <div class="px-4 py-3 flex gap-2 items-start" style="border-bottom:1px solid var(--line); ${n.read?'':'background:var(--brand-tint)'}">
            <div style="width:8px;height:8px;margin-top:6px;border-radius:50%;background:${n.read?'transparent':'var(--brand)'};flex-shrink:0"></div>
            <div class="min-w-0">
              <div class="text-xs leading-relaxed">${esc(n.message||'')}</div>
              <div class="text-[10px] mt-1" style="color:var(--ink-soft)">${fmtDT(n.createdAt)}</div>
            </div>
          </div>`).join('') : `<div class="px-4 py-8 text-center text-sm" style="color:var(--ink-soft)">لا توجد إشعارات بعد</div>`}
      </div>
    </div>`;
}
async function markVisibleNotifsRead(){
  const unread = myNotifications().filter(n=>!n.read).slice(0,30);
  for(const n of unread){ try{ await updateDoc(doc(db,'notifications',n.id), { read:true }); }catch(e){} }
}
document.addEventListener('click', (e)=>{
  const panel = $('#notifPanel'), btn = $('#notifBtn');
  if(!panel || panel.classList.contains('hidden')) return;
  if(panel.contains(e.target) || (btn && btn.contains(e.target))) return;
  S.notifOpen = false; panel.classList.add('hidden');
});

/* ============================= LOG / NOTIFY HELPERS ============================= */
async function addLog(reqId, reqNumber, action, details){
  try{ await addDoc(collection(db,'logs'), { requestId:reqId, requestNumber:reqNumber, action, details:details||'', byUserId:S.me.uid, byUserName:S.me.name||'', role:S.role, at:nowISO() }); }
  catch(e){ console.error('log fail', e); }
}
async function notify({toRole, toUserId, requestId, requestNumber, message}){
  try{ await addDoc(collection(db,'notifications'), { toRole:toRole||null, toUserId:toUserId||null, requestId, requestNumber, message, createdAt:nowISO(), read:false }); }
  catch(e){ console.error('notify fail', e); }
}

function wireCardEvents(){
  document.querySelectorAll('[data-action="accept"]').forEach(b=>b.onclick=()=>doAccept(b.dataset.id));

async function doAccept(id){
  const r = S.requests.find(x=>x.id===id); if(!r) return;
  try{
    await updateDoc(doc(db,'requests',id), { status:'accepted', acceptedAt:nowISO(), acceptedBy:S.me.uid, acceptedByName:S.me.name||'', updatedAt:nowISO() });
    await addLog(id, r.requestNumber, 'تم قبول الطلب', '');
    await notify({ toUserId:r.createdBy, requestId:id, requestNumber:r.requestNumber, message:`تم قبول طلب الفحص رقم ${r.requestNumber} — ${r.employeeNameAr}` });
    toast('تم قبول الطلب');
  }catch(e){ console.error(e); toast('تعذّر تنفيذ العملية','error'); }
}
async function doTransition(id, status, atField, byField, nameField, msg){
  const r = S.requests.find(x=>x.id===id); if(!r) return;
  try{
    await updateDoc(doc(db,'requests',id), { status, [atField]:nowISO(), [byField]:S.me.uid, [nameField]:S.me.name||'', updatedAt:nowISO() });
    await addLog(id, r.requestNumber, msg, '');
    if(status==='completed'){
      await notify({ toUserId:r.createdBy, requestId:id, requestNumber:r.requestNumber, message:`اكتمل طلب الفحص رقم ${r.requestNumber} — ${r.employeeNameAr}` });
    }
    toast(msg); closeModal();
  }catch(e){ console.error(e); toast('تعذّر تنفيذ العملية','error'); }
}
function openRejectModal(id){
  const r = S.requests.find(x=>x.id===id); if(!r) return;
  const wrap = el('div','modal-backdrop');
  wrap.innerHTML = `
    <div class="card p-5 w-full max-w-sm fade-in">
      <h3 class="font-bold mb-1">رفض الطلب</h3>
      <p class="text-xs mb-3" style="color:var(--ink-soft)">طلب رقم ${esc(r.requestNumber)} — ${esc(r.employeeNameAr)}</p>
      <label class="field-label">سبب الرفض *</label>
      <textarea id="rejectReason" rows="3" placeholder="اكتب سبب الرفض هنا"></textarea>
      <div class="flex gap-2 mt-4">
        <button id="rejectConfirm" class="btn btn-danger px-4 py-2.5 text-sm flex-1">تأكيد الرفض</button>
        <button id="rejectCancel" class="btn btn-ghost px-4 py-2.5 text-sm">إلغاء</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  wrap.querySelector('#rejectCancel').onclick = ()=>wrap.remove();
  wrap.onclick = (e)=>{ if(e.target===wrap) wrap.remove(); };
  wrap.querySelector('#rejectConfirm').onclick = async ()=>{
    const reason = wrap.querySelector('#rejectReason').value.trim();
    if(!reason){ toast('الرجاء كتابة سبب الرفض','error'); return; }
    try{
      await updateDoc(doc(db,'requests',id), { status:'rejected', rejectionReason:reason, rejectedAt:nowISO(), rejectedBy:S.me.uid, rejectedByName:S.me.name||'', updatedAt:nowISO() });
      await addLog(id, r.requestNumber, 'تم رفض الطلب', reason);
      await notify({ toUserId:r.createdBy, requestId:id, requestNumber:r.requestNumber, message:`تم رفض طلب الفحص رقم ${r.requestNumber} — السبب: ${reason}` });
      toast('تم رفض الطلب'); wrap.remove();
    }catch(e){ console.error(e); toast('تعذّر تنفيذ العملية','error'); }
  };
}

/* ---------------- Shared: Requests Log ---------------- */
function renderLog(){
  const body = $('#pageBody'); if(!body) return;
  const companies = Array.from(new Set(S.requests.map(r=>r.companyName).filter(Boolean))).sort();
  const sponsors = Array.from(new Set(S.requests.map(r=>r.sponsorName).filter(Boolean))).sort();
  body.innerHTML = `

        <div><label class="field-label">الحالة</label><select id="fstatus"><option value="">الكل</option>${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${S.filters.status===k?'selected':''}>${v.label}</option>`).join('')}</select></div>
        <div><label class="field-label">الشركة</label><select id="fcompany"><option value="">الكل</option>${companies.map(c=>`<option ${S.filters.company===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
        <div><label class="field-label">الكفيل</label><select id="fsponsor"><option value="">الكل</option>${sponsors.map(c=>`<option ${S.filters.sponsor===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
        <div><label class="field-label">من تاريخ</label><input type="date" id="ffrom" value="${S.filters.from}"></div>
        <div><label class="field-label">إلى تاريخ</label><input type="date" id="fto" value="${S.filters.to}"></div>
      </div>
    </div>
    <div id="logTableWrap"></div>`;
  const apply = ()=>{
    S.filters = { q: $('#fq').value.trim(), status: $('#fstatus').value, company: $('#fcompany').value, sponsor: $('#fsponsor').value, from: $('#ffrom').value, to: $('#fto').value };
    renderLogTable();
  };
  ['fq','fstatus','fcompany','fsponsor','ffrom','fto'].forEach(id=>{ $('#'+id).addEventListener('input', apply); $('#'+id).addEventListener('change', apply); });
  renderLogTable();
}
function renderLogTable(){
  const wrap = $('#logTableWrap'); if(!wrap) return;
  const f = S.filters;
  let items = S.requests.slice();
  if(f.q){ const q = f.q.toLowerCase(); items = items.filter(r => [r.employeeNameAr,r.employeeNameEn,r.idNumber,r.requestNumber].some(v=> (v||'').toLowerCase().includes(q))); }
  if(f.status) items = items.filter(r=>r.status===f.status);
  if(f.company) items = items.filter(r=>r.companyName===f.company);
  if(f.sponsor) items = items.filter(r=>r.sponsorName===f.sponsor);
  if(f.from) items = items.filter(r=> r.createdAt && r.createdAt.slice(0,10) >= f.from);
  if(f.to) items = items.filter(r=> r.createdAt && r.createdAt.slice(0,10) <= f.to);
  
  wrap.innerHTML = requestsTable(items);
  wireRequestTableEvents();
}

          <td><span class="badge" style="background:${st.tint};color:${st.fg}">${st.label}</span></td>
          <td style="color:var(--ink-soft)">${fmtD(r.createdAt)}</td>
          <td><button class="btn btn-ghost px-2.5 py-1 text-xs" data-openreq="${r.id}">تفاصيل</button></td></tr>`; }).join('')}
      </tbody>
    </table></div>
  </div>

  <!-- Mobile Card List View -->
  <div class="md:hidden flex flex-col gap-3">
    ${items.map(r=>{ const st = STATUS[r.status]||STATUS.sent; return `
      <div class="card p-3.5 fade-in flex items-center justify-between gap-2">
        <div class="min-w-0">
          <div class="flex items-center gap-2 mb-1">
            <span class="font-bold text-xs">${esc(r.requestNumber)}</span>
            <span class="badge text-[10px] py-0.5 px-2" style="background:${st.tint};color:${st.fg}">${st.label}</span>
          </div>
          <div class="font-bold text-sm truncate">${esc(r.employeeNameAr)}</div>
          <div class="text-[11px]" style="color:var(--ink-soft)">هوية: ${esc(r.idNumber)} \vert{}${esc(r.companyName)}</div>
        </div>
        <button class="btn btn-ghost px-3 py-1.5 text-xs shrink-0" data-openreq="${r.id}">تفاصيل</button>
      </div>`; }).join('')}
  </div>`;
}

function wireRequestTableEvents(){ document.querySelectorAll('[data-openreq]').forEach(b=>b.onclick=()=>openDetailModal(b.dataset.openreq)); }
function emptyState(title, sub){
  return `<div class="text-center py-12 px-4 card">
    <div class="mx-auto mb-3" style="width:48px;height:48px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--ink-soft)">${iconInbox}</div>
    <div class="font-bold text-sm mb-1">${esc(title)}</div><div class="text-xs" style="color:var(--ink-soft)">${esc(sub)}</div></div>`;
}

/* ---------------- Detail modal ---------------- */
function openDetailModal(id){
  const r = S.requests.find(x=>x.id===id); if(!r) return;
  const st = STATUS[r.status]||STATUS.sent;
  const wrap = el('div','modal-backdrop');
  const photo = r.photoURL ? `<img src="${r.photoURL}" class="avatar" style="width:56px;height:56px">` : `<div class="avatar flex items-center justify-center" style="width:56px;height:56px;color:var(--ink-soft)">${iconUser}</div>`;

  let actionsHTML = '';
  if(S.role==='reception'){
    if(r.status==='sent') actionsHTML = `<button class="btn btn-brand px-4 py-2.5 text-xs md:text-sm flex-1" data-action="accept" data-id="${r.id}">قبول الطلب</button><button class="btn btn-danger px-4 py-2.5 text-xs md:text-sm flex-1" data-action="reject" data-id="${r.id}">رفض الطلب</button>`;
    else if(r.status==='accepted') actionsHTML = `<button class="btn btn-brand px-4 py-2.5 text-xs md:text-sm flex-1" data-action="checkin" data-id="${r.id}">تسجيل حضور الموظف</button>`;
    else if(r.status==='attended') actionsHTML = `<button class="btn btn-brand px-4 py-2.5 text-xs md:text-sm flex-1" data-action="examine" data-id="${r.id}">تم الفحص</button>`;
    else if(r.status==='examined') actionsHTML = `<button class="btn btn-brand px-4 py-2.5 text-xs md:text-sm flex-1" data-action="complete" data-id="${r.id}">إكمال الطلب</button>`;
  }

  wrap.innerHTML = `
    <div class="card p-5 w-full max-w-lg fade-in" style="max-height:90vh;overflow:auto">
      <div class="flex items-start justify-between gap-3 mb-4">
        <div class="flex items-center gap-3">${photo}<div><div class="font-bold">${esc(r.employeeNameAr)}</div><div class="text-xs" style="color:var(--ink-soft)">${esc(r.employeeNameEn||'')}</div></div></div>
        <span class="badge" style="background:${st.tint};color:${st.fg}">${st.label}</span>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-y-2 text-sm mb-3">
        <div><span style="color:var(--ink-soft)">رقم الطلب: </span><b>${esc(r.requestNumber)}</b></div>
        <div><span style="color:var(--ink-soft)">الهوية: </span>${esc(r.idNumber)}</div>
        <div><span style="color:var(--ink-soft)">الكفيل: </span>${esc(r.sponsorName)}</div>
        <div><span style="color:var(--ink-soft)">الشركة: </span>${esc(r.companyName)}</div>
        <div class="sm:col-span-2"><span style="color:var(--ink-soft)">فاتورة باسم: </span>${esc(r.billingCompany)}</div>
        <div class="sm:col-span-2"><span style="color:var(--ink-soft)">نوع الفحص: </span>${esc(r.examType||'—')}</div>
        ${r.notes? `<div class="sm:col-span-2"><span style="color:var(--ink-soft)">ملاحظات: </span>${esc(r.notes)}</div>`:''}
        ${r.status==='rejected' && r.rejectionReason ? `<div class="sm:col-span-2 p-2.5 rounded-lg" style="background:var(--red-tint);color:var(--red)"><b>سبب الرفض:</b> ${esc(r.rejectionReason)}</div>` : ''}
      </div>
      <div class="text-xs mb-4" style="color:var(--ink-soft)">
        <div>تاريخ الطلب: ${fmtDT(r.createdAt)} — بواسطة ${esc(r.createdByName||'—')}</div>
        ${r.acceptedAt? `<div>تاريخ القبول: ${fmtDT(r.acceptedAt)} — بواسطة ${esc(r.acceptedByName||'—')}</div>`:''}
        ${r.checkinAt? `<div>تاريخ حضور الموظف: ${fmtDT(r.checkinAt)}</div>`:''}
        ${r.examinedAt? `<div>تاريخ الفحص: ${fmtDT(r.examinedAt)}</div>`:''}
        ${r.completedAt? `<div>تاريخ الإكمال: ${fmtDT(r.completedAt)}</div>`:''}
        ${r.rejectedAt? `<div>تاريخ الرفض: ${fmtDT(r.rejectedAt)} — بواسطة ${esc(r.rejectedByName||'—')}</div>`:''}
      </div>
      ${actionsHTML? `<div class="flex flex-wrap gap-2 pt-3 mb-2" style="border-top:1px solid var(--line)">${actionsHTML}</div>`:''}
      <button id="closeModalBtn" class="btn btn-ghost px-4 py-2.5 text-sm w-full mt-2">إغلاق</button>
    </div>`;
  document.body.appendChild(wrap);
  wrap.onclick = (e)=>{ if(e.target===wrap) wrap.remove(); };
  wrap.querySelector('#closeModalBtn').onclick = ()=>wrap.remove();
  wrap.querySelectorAll('[data-action="accept"]').forEach(b=>b.onclick=()=>{ doAccept(b.dataset.id); wrap.remove(); });
  wrap.querySelectorAll('[data-action="reject"]').forEach(b=>b.onclick=()=>{ wrap.remove(); openRejectModal(b.dataset.id); });
  wrap.querySelectorAll('[data-action="checkin"]').forEach(b=>b.onclick=()=>doTransition(b.dataset.id,'attended','checkinAt','checkinBy','checkinByName','تم تسجيل حضور الموظف'));
  wrap.querySelectorAll('[data-action="examine"]').forEach(b=>b.onclick=()=>doTransition(b.dataset.id,'examined','examinedAt','examinedBy','examinedByName','تم إجراء الفحص'));
  wrap.querySelectorAll('[data-action="complete"]').forEach(b=>b.onclick=()=>doTransition(b.dataset.id,'completed','completedAt','completedBy','completedByName','تم إكمال الطلب'));
}

</script>
